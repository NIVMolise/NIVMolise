rale delle minoranze linguistiche del Molise.</li><li>Coordinamento, gestione tecnico-amministrativa, monitoraggio delle attività, in raccordo con i competenti Servizi regionali, per il riconoscimento internazionale di siti e beni culturali regionali.</li><li>Sviluppo e promozione dello spettacolo.</li><li>Attuazione di iniziative convegnistiche, espositive, pubblicistiche per la conoscenza e la promozione delle attività culturali.</li><li>Rapporti con la Fondazione Molise Cultura.</li><li>Programmazione, progettazione e attuazione di interventi di promozione di eventi culturali anche a fini di sviluppo del territorio e del turismo.</li><li>Procedimenti afferenti all’esercizio del turismo rurale in applicazione della L.R. n. 9/2011: sopralluoghi, ispezioni, iscrizione operatori e gestione registri.</li><li>Coordinamento di iniziative e manifestazioni che coinvolgono le associazioni molisane nel mondo.</li><li>Organizzazione per il funzionamento delle attività del Consiglio dei molisani nel mondo.</li><li>Interventi socioassistenziali dei molisani nel mondo.</li><li>Iniziative per il reinserimento scolastico a favore dei molisani nel mondo che rientrano in Regione.</li><li>Rapporti con l’IRESMO.</li><li>Programmazione e coordinamento per la comunicazione e la promozione del brand identificativo del Molise.</li><li>Programmazione pluriennale e annuale per la qualificazione dell’offerta turistica e per la promozione turistica e integrata della “risorsa Molise”.</li><li>Programmi, indirizzi e coordinamento dell'Osservatorio regionale sul turismo e statistiche sul turismo.</li><li>Portale turistico regionale.</li><li>Interventi e progetti finalizzati alla valorizzazione e fruizione delle aree costiere e alla incentivazione della qualità dell’offerta ricettiva balneare.</li><li>Interventi per il recupero della tradizione dei trabucchi della costa molisana.</li><li>Valorizzazione e sviluppo delle attività termali e pratiche bionaturali.</li><li>Promozione delle attività delle pro loco nell'ambito del turismo.</li><li>Determinazione dei presupposti, requisiti e criteri per la concessione e la erogazione alle imprese e alle associazioni turistiche di contributi, sovvenzioni ed incentivi.</li><li>Formulazione, attuazione, monitoraggio e rendicontazione di programmi e progetti regionali, interregionali, nazionali e internazionali in materia di turismo e promozione integrata del territorio.</li><li>Costruzione del prodotto turistico e sostegno alle imprese.</li><li>Gestione dell’albo regionale dei direttori tecnici di agenzie di viaggio.</li><li>Rilascio autorizzazioni per competizioni sportive.</li><li>Assistenza tecnico-operativa e di segreteria della Commissione Consultiva per lo Sport.</li><li>Accertamento dei requisiti tecnico-professionali dei Direttori tecnici di Agenzie di Viaggio (L.R. n. 32/96). Adempimenti relativi alle Professioni turistiche di guida, interprete e accompagnatore di cui alla L.R. n. 36/96. Adempimenti relativi alla promozione delle attività e delle manifestazioni sportive (Programma annuale di promozione sportiva), coordinamento e gestione di attività e progetti sportivi in ambito scolastico, formazione e aggiornamento dei Maestri di sci.</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise. Sopralluoghi, ispezioni, istruttoria per il rilascio di classificazione degli esercizi ricettivi.</li><li>Gestione e controllo data base strutture ricettive presenti su tutto il territorio regionale. Gestione e controllo del sistema di rilevamento statistico riguardante le presenze e gli arrivi registrati nelle strutture ricettive (alberghiere ed extralberghiere) della regione.</li><li>Cura del normale funzionamento della distribuzione del materiale informativo presso le strutture ricettive.</li><li>Assistenza al turista.</li><li>Parere in fase di approvazione regolamento comunale per la determinazione e rideterminazione del contingente numerico degli autoveicoli da adibire al servizio di noleggio con conducente nei paesi di competenza.</li><li>Rapporti con le agenzie di viaggio e i tour operator (parere autorizzazioni aperture – trasferimenti sede agenzie di viaggi e turismo e tour operator).</li><li>Cura dei rapporti con l’istituto nazionale di statistica (ISTAT) finalizzati a:<ol type=\"a\"><li>Fornitura dati statistici relativi al flusso turistico presente nella Regione Molise (cadenza mensile);</li><li>Confronto e verifica tra i dati forniti dalla regione e quelli dell’Istat relativi al flusso turistico della Regione Molise (cadenza annuale);</li><li>Fornitura e aggiornamento sulla consistenza delle strutture ricettive (cambio gestione – cambio denominazione – cambio categoria – chiusure - nuove aperture - ampliamenti – diminuzioni) con cadenza annuale;</li><li>Intermediazione tra l’azienda autonoma di soggiorno e turismo di Termoli e l’Istat per la trasmissione dei dati;</li><li>Cura dei rapporti con la Banca d’Italia in merito ai dati statistici relativi al flusso turistico e alla consistenza delle strutture ricettive della Regione Molise;</li><li>Rapporti con comuni, università aziende in merito ai dati statistici relativi al flusso turistico e alla consistenza delle strutture ricettive della Regione Molise.</li></ol></li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A2.06":{"rif":"II.5","titolo":"SERVIZIO SISTEMI INFORMATIVI E TRANSIZIONE AL DIGITALE","n":4,"html":"<ol><li>Responsabile per la transizione digitale e difensore civico digitale per le attribuzioni ex art. 17 del CAD – D.Lgs. 7 marzo 2005, 82 ss.mm.ii.</li><li>Attività di coordinamento dei sistemi informativi regionali e di quelli degli Enti strumentali e delle Partecipate regionali anche in raccordo con la Molise Dati S.p.A., Società in house della Regione.</li><li>Tenuta dei rapporti con gli enti regolatori nazionali e comunitari aventi competenza nel campo dei sistemi informativi.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A3.01":{"rif":"III.1","titolo":"SERVIZIO PIANIFICAZIONE E GESTIONE TERRITORIALE E PAESAGGISTICA – TECNICO DELLE COSTRUZIONI","n":18,"html":"<ol><li>Attività connesse alla predisposizione dei Piani Paesaggistici ex art. 143 D.Lgs 42/2004.</li><li>Autorità competente ai sensi dell’art. 5 del D.Lgs. n. 152/2006 nei procedimenti di valutazione ambientale strategica in cui la Regione Molise - Servizio Tutela e Valutazioni ambientali – Fitosanitario regionale riveste il ruolo di autorità procedente.</li><li>Attività connesse alle Valutazioni Ambientali Strategiche ex art. 6 e ss. D. Lgs 152/2006.</li><li>Piani urbanistici generali e piani attuativi ex artt. 7 e 13 L. 1150/1942.</li><li>Conferenze di Servizi – Intese – Accordi di Programma.</li><li>Rilascio autorizzazioni ex art. 146 D. Lgs 42/2004 ed ex D.P.R. 31/2017.</li><li>Proposte di accertamento ex art. 167 D. Lgs 42/2004 ed ex D.P.R. 31/2017.</li><li>Rilascio Accertamenti di conformità ex art. 167 D. Lgs 142/2004.</li><li>Procedure di stima Indennità Risarcitoria Danno Ambientale.</li><li>Autorizzazione all’inizio dei lavori privati e pubblici ex art. 94 D.P.R. 380/2001.</li><li>Adempimenti di cui all’art.4 comma 2 L.R. 25/2011.</li><li>Adempimenti amministrativi correlati al processo costruttivo (inizio lavori, piani di manutenzione, fine lavori, collaudi) ex art. 94 D.P.R. 380/2001.</li><li>Coordinamento Commissione Tecnica regionale ex art. 14 L.R. 20/1996.</li><li>Adempimenti in materia urbanistica correlati al rischio sismico.</li><li>Adempimenti tecnici per la vigilanza sulle costruzioni in zona sismica e giuridico-amministrativi per la repressione delle violazioni ex artt.95 e ss. D.P.R. 380/2001.</li><li>Adempimenti connessi all’adeguamento delle opere abusive in zona sismica ex artt. 99 e 100 D.P.R. 380/2001.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li><li>Sportello Unico Autorizzazioni Regionali.</li></ol>"},"A3.02":{"rif":"III.2","titolo":"SERVIZIO GEOLOGICO","n":15,"html":"<ol><li>Attività di supporto e consulenza tecnica in materia di geologia, idrogeologia e sismica per i servizi regionali con particolare riferimento alle problematiche dell’ambiente, della difesa del suolo, dell’assetto e della pianificazione territoriale, dell’uso compatibile del suolo.</li><li>Prevenzione dal rischio geologico, idrogeologico e sismico con particolare riferimento alle aree urbane e alle opere pubbliche di interesse regionale.</li><li>Gestione di vincoli a carattere geologico e sismico anche con riferimento ai centri abitati classificati instabili (legge 445/1908) relativamente ai pareri previsti dall’art. 89 D.P.R. 380/2001 (ex art.13 L. 64/1974).</li><li>Microzonazione sismica dei centri abitati con particolare riguardo alla revisione e aggiornamento alla luce degli indirizzi e criteri per la microzonazione sismica redatti a cura del Dipartimento della Protezione civile nazionale.</li><li>Attività di indagine sul territorio per il censimento e la conoscenza ed il monitoraggio delle aree instabili (aggiornamento banca dati del progetto IFFI, Inventario dei Fenomeni Franosi in Italia).</li><li>Attività finalizzate alla riclassificazione sismica del territorio regionale.</li><li>Censimento e catalogazione dei Geositi.</li><li>Attività di gestione per la realizzazione delle carte geologiche e carte geotematiche regionali.</li><li>Attività per la spesa e/o per la concessione di contributi per studi, indagini e ricerche di carattere geologico.</li><li>Reti geodetiche, immagini aerofotogrammetriche e satellitari di uso cartografico.</li><li>Programmazione, sviluppo e gestione della cartografia di base e tematica per il sistema informativo territoriale regionale.</li><li>Raccordo con gli indirizzi delle regioni contermini e con gli enti cartografici nazionali.</li><li>Supervisione dell’archivio cartografico regionale, delle banche dati geografiche e nella realizzazione di sottosistemi informativi geografici di altri servizi.</li><li>Diffusione dei prodotti cartografici regionali presso gli utenti privati e le strutture regionali.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A3.03":{"rif":"III.3","titolo":"SERVIZIO INFRASTRUTTURE E LAVORI PUBBLICI","n":30,"html":"<ol><li>Programmazione e gestione in materia di edilizia di culto e pubblica (municipi ed edifici comunali adibiti a usi pubblici).</li><li>Programmazione e gestione in materia di edilizia scolastica, ivi compresa la manutenzione e la messa in sicurezza.</li><li>Impianti di pubblica illuminazione comunale.</li><li>Programmazione e gestione in materia di mobilità comunale, soprattutto nei centri storici, di interventi di realizzazione e manutenzione, ivi comprese piste ciclabili e marciapiedi.</li><li>Attuazione indirizzi di programmazione in materia di infrastrutture sanitarie, sociali, scolastiche, sportive e di culto.</li><li>Programmazione e monitoraggio dell’impiantistica sportiva.</li><li>Programmazione in materia di edilizia residenziale.</li><li>Programmazione fondo sostegno per l’accesso alle abitazioni in locazione (Legge n. 431/98).</li><li>Verifiche e vigilanza sull’attuazione dei programmi e degli interventi.</li><li>Regolazione flussi finanziari e rapporti con la Cassa Depositi e Prestiti.</li><li>Monitoraggio attività dell’E.R.E.S.</li><li>Osservatorio regionale sulla condizione abitativa (L. n. 431/1998) e rapporti con l’Osservatorio nazionale e le altre regioni.</li><li>Studio, ricerche e indagini sul fabbisogno abitativo, anagrafe utenti.</li><li>Canoni di locazione, bandi speciali, piani di vendita, limiti massimi di costo ammissibili per l’edilizia residenziale.</li><li>Determinazione linee di intervento, obiettivi e tipologie realizzative.</li><li>Redazione e gestione dei bandi di concorso.</li><li>Programmazione ed istruttoria tecnico-amministrativa e finanziaria di programmi e progetti di viabilità.</li><li>Esecuzione tecnico-amministrativa e finanziaria di programmi di intervento e progetti di viabilità comunale di rilevanza rurale.</li><li>Classificazione della viabilità regionale.</li><li>Istituzione e tenuta del Catasto viario regionale.</li><li>Coordinamento ed attuazione piani nazionali sulla sicurezza stradale.</li><li>Attività di trasferimento della rete viaria tra Stato, Regione ed Enti Locali.</li><li>Attuazione e monitoraggio interventi FSC APQ e altri di competenza del Servizio.</li><li>Attuazione e monitoraggio interventi PAR FSC Molise 2007-2013.</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise ratione materiae.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li><li>Partecipazione alla commissione regionale per il rilevamento del costo dei materiali, dei noli e dei trasporti presso Provveditorato Opere Pubbliche Campania-Molise.</li><li>Partecipazione alla commissione presso la Camera di Commercio Campobasso per l’aggiornamento del prezziario regionale e relativi adempimenti per l’approvazione.</li><li>Rappresentanza della Regione nelle Commissioni di vigilanza dei pubblici spettacoli presso le prefetture di Campobasso e Isernia.</li><li>Segreteria del CTAR di cui alla legge regionale n. 19/1979.</li></ol>"},"A3.04":{"rif":"III.4","titolo":"SERVIZIO MOBILITA’","n":16,"html":"<ol><li>Organizzazione di reti e servizi intermodali di trasporto pubblico.</li><li>Pianificazione e programmazione dei servizi minimi di trasporto su gomma e su ferro.</li><li>Gestione e autorizzazioni della rete dei servizi minimi di TPL e dei servizi aggiuntivi e residuali.</li><li>Gestione e revisione dei contratti di servizio trasporto su gomma e su ferro.</li><li>Autonoleggi, servizi speciali ed eccezionali.</li><li>Vigilanza, collaudi e verifiche dei servizi di trasporto.</li><li>Gestione e programmazione dei servizi inerenti i trasporti pubblici ferroviari, lacuali, marittimi, aerei e impianti fissi con i relativi nodi di interscambio.</li><li>Gestione e programmazione dei servizi inerenti interporti, centri intermodali e trasporto merci, porti e scali aeroportuali.</li><li>Attuazione e gestione degli interventi finanziati nelle materie di competenza.</li><li>Regolamentazione accesso alla rete ferroviaria regionale.</li><li>Investimenti materiale rotabile ferroviario.</li><li>Investimenti materiale rotabile, automobilistico adibito ai servizi di TPL.</li><li>Pianificazione e programmazione della mobilità sostenibile.</li><li>Implementazione della Banca Dati dell’Osservatorio Nazionale per le politiche del TPL istituito ai sensi dell’art. 1 comma 300 L. 244/07 e ss.mm.ii..</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise ratione materiae.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A3.05":{"rif":"III.5","titolo":"SERVIZIO DIFESA DEL SUOLO, DEMANIO, OPERE IDRAULICHE E MARITTIME – IDRICO INTEGRATO","n":14,"html":"<ol><li>Redazione dei piani stralcio per l’assetto idrogeologico.</li><li>Pianificazione, programmazione ed attuazione degli interventi in materia di salvaguardia, conservazione e difesa del suolo, con particolare riferimento al consolidamento dei centri abitati classificati instabili ed alle opere pubbliche di interesse regionale, anche ai fini della redazione e gestione del Repertorio Nazionale degli Interventi per la Difesa del Suolo (RENDIS), di cui al D.L. 180/98 (“Decreto Sarno” convertito con modificazioni in legge dalla L. 267/98).</li><li>Gestione e monitoraggio dei centri abitati classificati instabili e soggetti a consolidamento.</li><li>Adempimenti connessi con l’art. 2 della legge 2/2/1974, n. 64.</li><li>Programmazione, gestione ed esecuzione di programmi di opere idrauliche di competenza regionale.</li><li>Gestione e Programmazione dell’utilizzo e della tutela delle risorse idriche regionali superficiali e sotterranee.</li><li>Contratti di Fiume e di Costa per le materie di competenza.</li><li>Coordinamento delle attività di monitoraggio e vigilanza sul demanio fluviale con i Carabinieri Forestali, l'Agenzia del Demanio e gli altri Enti competenti. Adempimenti in materia di dighe e traverse di competenza regionale.</li><li>Esercizio delle funzioni amministrative, di indirizzo, programmazione, pianificazione e regolamentazione dell’utilizzo connesse alla gestione del demanio marittimo e di zone di mare territoriale delegate alla Regione.</li><li>Tutela, conservazione e gestione del demanio regionale.</li><li>Controllo dei beni demaniali e dei relativi rapporti concessori e riscossione di entrate derivanti dalla gestione del demanio regionale, in raccordo con i diversi Servizi competenti che curano l’attività istruttoria, ai soli fini autorizzativi.</li><li>Cura degli adempimenti amministrativi nelle procedure di espropriazione per pubblica utilità necessari per la realizzazione di opere pubbliche di competenza regionale.</li><li>Egam: coordinamento, verifica, controllo e approvazione dei piani pluriennali di gestione delle risorse idriche.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio</li></ol>"},"A4.01":{"rif":"IV.1","titolo":"SERVIZIO POLITICHE PER L’OCCUPAZIONE","n":27,"html":"<ol><li>Coordinamento, indirizzo e verifica delle attività di programmazione delle politiche del lavoro.</li><li>Accreditamento dei servizi per il lavoro e gestione dell’albo regionale dei soggetti accreditati.</li><li>Coordinamento, indirizzo e verifica del sistema regionale dei servizi per l’impiego.</li><li>Tenuta dell’elenco regionale del personale collocato in disponibilità dalle pubbliche amministrazioni e gestione delle relative procedure di mobilità.</li><li>Raccordo con le strutture di assistenza tecnica.</li><li>Interventi per l’implementazione dei servizi per l’impiego e per la realizzazione di politiche attive del lavoro.</li><li>Monitoraggio finanziario e procedurale degli interventi</li><li>Gestione delle crisi aziendali e settoriali nelle procedure di cassa integrazione guadagni straordinaria e per la dichiarazione della mobilità del personale nel settore privato.</li><li>Approvazione delle liste regionali di mobilità.</li><li>Gestione degli ammortizzatori sociali in deroga.</li><li>Gestione del Fondo regionale per le anticipazioni dei trattamenti in deroga.</li><li>Programmazione ed attuazione di misure ed interventi di sostegno al reddito a favore di lavoratori svantaggiati.</li><li>Promozione e sostegno dei percorsi di reinserimento al lavoro dei soggetti espulsi dal sistema produttivo.</li><li>Programmazione interventi finalizzati alla creazione d’impresa, all’autoimpiego e all’inserimento lavorativo.</li><li>Assistenza tecnica alla Commissione Regionale per l’emersione del lavoro irregolare e raccordo con le Direzioni Provinciali del Lavoro.</li><li>Programmazione ed attuazione delle misure di intervento finalizzate alla promozione dell’occupazione dei soggetti disabili, di cui alla legge n. 68/99 e alla legge regionale n. 26/2002.</li><li>Gestione risorse del Fondo nazionale e regionale per l’occupazione dei disabili.</li><li>Programmazione e attuazione delle misure di intervento finalizzate alla promozione dell’inserimento lavorativo dei giovani inoccupati e disoccupati.</li><li>Programmazione e attuazione delle misure di intervento per la promozione e la valorizzazione dell’apprendistato.</li><li>Legge n. 53/00 e legge n. 236/93 – Formazione continua e aggiornamento dei lavoratori.</li><li>Attuazione delle disposizioni di cui alla legge regionale 29 luglio 2013, n. 13, in materia di tirocini.</li><li>Promozione iniziative per la diffusione della cultura della sicurezza sul lavoro e per l’aggiornamento professionale dei tecnici della prevenzione della A.S.Re.M. e per l’aggiornamento della dotazione strumentale.</li><li>Assistenza al Comitato Regionale di Coordinamento per la sicurezza sui luoghi di lavoro e programmazione interventi di formazione professionale in materia di sicurezza sul lavoro.</li><li>Attuazione e monitoraggio interventi FSC APQ “Politiche del Lavoro”.</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise ratione materiae.</li><li>Supporto e coordinamento alle attività relative alle politiche per le pari opportunità.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A4.02":{"rif":"IV.2","titolo":"SERVIZIO PROGRAMMAZIONE DELLE POLITICHE SOCIALI","n":31,"html":"<ol><li>Programmazione e organizzazione del sistema integrato di interventi e dei servizi sociali.</li><li>Programmazione, monitoraggio e verifica degli interventi ed azioni previste dal Piano Sociale Regionale.</li><li>Emanazione di direttive in materia di organizzazione dei servizi pubblici e definizione dei criteri e dei requisiti organizzativi e tecnici dei servizi e delle attività erogate da soggetti privati, per le materie di competenza del Servizio.</li><li>Programmazione di interventi socioassistenziali a sostegno della persona e della famiglia.</li><li>Promozione delle politiche attive e misure di sostegno in favore dei giovani e delle fasce deboli della popolazione.</li><li>Programmazione di azioni di sostegno all’infanzia e all’adolescenza.</li><li>Programmazione servizi di sostegno socioeducativo per la prima infanzia.</li><li>Organizzazione, attuazione e svolgimento di azioni in materia di Servizio civile.</li><li>Interventi a favore dei cittadini trapiantati o affetti da gravi patologie non trattabili nelle strutture sanitarie regionali.</li><li>Riparto del fondo regionale per la gestione dei servizi socioassistenziali, verifica della spesa locale e dei risultati di gestione dei fondi assegnati.</li><li>Piani di investimento per la realizzazione e la manutenzione di strutture socioassistenziali.</li><li>Osservatorio regionale dei fenomeni sociali e sociosanitari.</li><li>Definizione degli standard di competenza regionale per le strutture residenziali e semiresidenziali socioassistenziali.</li><li>Coordinamento e supporto alle attività del volontariato e dell’associazionismo di promozione sociale.</li><li>Interventi per la promozione e lo sviluppo del sistema cooperativo del Molise.</li><li>Elaborazione di linee guida e piani di intervento sociali in favore di cittadini stranieri appartenenti e non all'Unione Europea.</li><li>Assistenza sociale agli stranieri e programmazione ed indirizzi per gli interventi.</li><li>Autorizzazione, accreditamento, indirizzo e controllo delle strutture sociosanitarie pubbliche e private.</li><li>Interventi per la disabilità e la non autosufficienza, inerenti alle materie di competenza sociale.</li><li>Politiche di contrasto alla povertà.</li><li>Misure di contrasto alla violenza di genere.</li><li>Coordinamento di progetti di innovazione sociale per la partecipazione a bandi e a reti europea e nazionale.</li><li>Gestione fondi europei (asse inclusione sociale del FSE e linee dei fondi strutturali).</li><li>Recepimento di atti e/o intese Stato-Regioni, concernenti atti di indirizzo in merito a specifici aspetti relativi alle materie di competenza del Servizio.</li><li>Partecipazione ai tavoli tecnici della Conferenza Stato - Regione e unificata per le materie di competenza.</li><li>Attività di monitoraggio e verifica degli adempimenti posti in essere con gli obiettivi fissati nel piano di rientro e nei successivi programmi operativi, nelle materie di competenza del Servizio.</li><li>Collaborazione, per le materie di carattere interdisciplinare, con gli altri Servizi regionali.</li><li>Riscontro delle interrogazioni parlamentari e consiliari per le materie di competenza del Servizio.</li><li>Attuazione e monitoraggio interventi FSC APQ “Politiche Giovanili”.</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise ratione materiae.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A4.07":{"rif":"IV.3","titolo":"SERVIZIO POLITICHE DELL’ISTRUZIONE, DELLA FORMAZIONE PROFESSIONALE E DELL’UNIVERSITA’","n":26,"html":"<ol><li>Programmazione dell’offerta formativa integrata tra istruzione e formazione.</li><li>Programmazione offerta formativa istruzione tecnica superiore (I.T.S.).</li><li>Preparazione, accompagnamento e attuazione delle funzioni inerenti all’istruzione trasferite, delegate o affidate alla Regione.</li><li>Programmazione e certificazione dei percorsi formativi e delle competenze.</li><li>Indirizzi in materia di orientamento scolastico e professionale, in collaborazione con il Servizio competente in materia di politiche attive del lavoro.</li><li>Studi, ricerche, programmazione, attuazione e coordinamento degli interventi di contrasto della dispersione scolastica.</li><li>Diritto allo studio nella scuola dell’obbligo e nell’obbligo formativo.</li><li>Programmazione relativa ai servizi educativi di prima infanzia.</li><li>Programmazione e anagrafe edilizia scolastica.</li><li>Individuazione di progetti formativi per i lavoratori interessati agli ammortizzatori sociali.</li><li>Tirocini di reinserimento/inserimento nel mondo lavorativo.</li><li>Gestione fondi per la formazione professionale.</li><li>Accreditamento degli Organismi di formazione ed orientamento professionale regionale.</li><li>Autorizzazione delle attività libere di formazione professionale.</li><li>Sistema regionale delle competenze professionali, tenuta ed aggiornamento del Repertorio delle Professioni.</li><li>Controllo e vigilanza del mantenimento dei requisiti degli enti accreditati di formazione professionale e degli enti di intermediazione dei servizi per l’impiego.</li><li>Controllo e vigilanza delle attività libere di formazione professionale e/o di ogni altra attività svolta dagli enti accreditati.</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise ratione materiae.</li><li>Sviluppo, valorizzazione e promozione del Sistema universitario molisano, ivi compresi i conservatori e le altre istituzioni che svolgono attività di formazione universitaria.</li><li>Sostegno e potenziamento del diritto allo studio universitario.</li><li>Rapporti con l’ESU.</li><li>Promozione della collaborazione fra il sistema universitario molisano, gli istituti e gli altri soggetti attivi nel campo della ricerca e dell'alta formazione, fondazioni e centri di ricerca pubblici.</li><li>Sperimentazione di nuovi sistemi e linguaggi innovativi per la diffusione della cultura scientifica, attraverso la partecipazione a reti e progetti internazionali.</li><li>Sviluppo e aggregazione su scala territoriale di iniziative d’eccellenza con forte vocazione all’innovazione e alla ricerca.</li><li>Utilizzazione e valorizzazione dei risultati delle attività di ricerca, al fine di sviluppare le pratiche innovative e l’orientamento delle politiche in materia di educazione, formazione e lavoro.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A4.04":{"rif":"IV.4","titolo":"SERVIZIO RISORSE FINANZIARIE, BILANCIO E RAGIONERIA GENERALE","n":39,"html":"<ol><li>Predisposizione, elaborazione e aggiornamento delle proposte di legge di bilancio annuale e pluriennale, nonché predisposizione del documento tecnico di accompagnamento e delle proposte di legge regionale di stabilità.</li><li>Predisposizione delle proposte di legge regionale di variazione di bilancio e di assestamento di bilancio, in raccordo con la programmazione regionale.</li><li>Predisposizione della proposta sull’assegnazione ai servizi regionali dei budget di spesa e risorse di entrate.</li><li>Verifica della copertura finanziaria degli atti legislativi regionali che comportano impegni di spesa.</li><li>Raccordo e coordinamento con le strutture per la predisposizione dell’accertamento dei residui attivi e passivi.</li><li>Predisposizione del rendiconto finanziario e rendiconto patrimoniale, nonché della proposta di legge con relativa nota di accompagnamento.</li><li>Modificazioni del bilancio di previsione annuale da adottarsi con atti amministrativi.</li><li>Predisposizione, certificazione e definizioni degli strumenti per la verifica e il monitoraggio della spesa regionale ai fini dell’equilibrio di bilancio.</li><li>Rapporti con le agenzie di rating.</li><li>Rapporti con la Corte dei conti e con gli Organi governativi in materia di bilancio.</li><li>Gestione contabile delle entrate regionali e delle uscite regionali.</li><li>Attività di Controllo di Gestione.</li><li>Gestione dei ruoli di spesa fissa.</li><li>Gestione della fiscalità regionale passiva.</li><li>Visti e pareri contabili.</li><li>Trasferimento risorse finanziarie stabilite annualmente con Legge finanziaria, al Consiglio regionale, agli enti regionali.</li><li>Gestione contabile del debito pubblico regionale (mutui e prestiti obbligazionari) e dei pignoramenti.</li><li>Gestione contabile delle indennità, delle missioni e delle carte di credito del Presidente e dei componenti della Giunta regionale.</li><li>Predisposizione di report sul monitoraggio della spesa regionale, nonché delle entrate.</li><li>Attività di reportistica e monitoraggio dei trasferimenti statali ed europei.</li><li>Analisi della finanza regionale.</li><li>Analisi sull’impatto delle imposizioni fiscali.</li><li>Analisi e studi delle problematiche connesse all’attuazione del federalismo fiscale.</li><li>Acquisizione di risorse sul mercato del credito comprese le procedure per la stipulazione ed estinzione dei mutui e la gestione attiva dell'indebitamento.</li><li>Raccolta ed elaborazione di dati statistici in materia tributaria e fiscale, anche al fine dell'attuazione del federalismo fiscale.</li><li>Adempimenti inerenti ai tributi regionali.</li><li>Adeguamento normativo e tariffario.</li><li>Gestione e riscontro inerenti alle addizionali ed alle compartecipazioni al gettito erariale.</li><li>Economato.</li><li>Autorità di Certificazione POR FESR – FSE 2007-2013 e 2014-2020 (art. 126 del Reg (CE) 1303/2013).</li><li>Organismo di certificazione risorse FSC 2000-2006; FSC 2007-2013; FSC 2014-2020.</li><li>Gestione dei rapporti istituzionali tra la Regione e gli Enti del Servizio Sanitario Regionale per le materie di competenza del Servizio, su indicazione della Direzione Generale per la Salute.</li><li>Recepimento di atti e/o Intese Stato-Regioni, concernenti atti di indirizzo in merito a specifici aspetti relativi alle materie di competenza del Servizio.</li><li>Partecipazione, su indicazione della Direzione Generale per la Salute, ai tavoli tecnici della Conferenza Stato - Regione e unificata per le materie di competenza.</li><li>Gestione del contenzioso, per le materie di competenza del Servizio.</li><li>Riscontro delle interrogazioni, mozioni e interpellanze parlamentari e consiliari per le materie di competenza del Servizio.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li><li>Attuazione degli indirizzi in materia di controllo di gestione – Individuazione indicatori – Reportistica.</li><li>Creazione e gestione ruoli per la riscossione coattiva relativamente alle ordinanze-ingiunzioni adottati dai rispettivi servizi competenti (ex DGR n. 384 del 16-10-2017).</li></ol>"},"A4.05":{"rif":"IV.5","titolo":"SERVIZIO DATORE DI LAVORO","n":8,"html":"<ol><li>Gestione degli adempimenti amministrativi e strumentali di competenza del “Datore di lavoro” ai sensi del D. Lgs. n. 81/08.</li><li>Attuazione delle misure di vigilanza della sicurezza dei luoghi di lavoro e dei dipendenti della Regione attraverso attività di rilevazione, valutazione, monitoraggio e controllo dei rischi e attività di sorveglianza sanitaria.</li><li>Programmazione e attuazione delle attività di informazione e formazione dei dipendenti regionali previste dal D. Lgs n. 81/2008.</li><li>Fornitura dei dispositivi individuali di protezione.</li><li>Programmazione degli interventi di adeguamento a norma degli ambienti di lavoro assicurandone il costante livello di sicurezza e di protezione del personale.</li><li>Designazione dei lavoratori incaricati dell'attuazione delle misure di prevenzione incendi e lotta antincendio, di evacuazione dei luoghi di lavoro in caso di pericolo grave e immediato, di salvataggio, di primo soccorso e di gestione dell'emergenza.</li><li>Adozione delle misure per il controllo e la prevenzione delle situazioni di rischio in caso di emergenza.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A4.06":{"rif":"IV.6","titolo":"SERVIZIO LOGISTICA, PATRIMONIO E SERVIZI GENERALI","n":8,"html":"<ol><li>Inventariazione, rendicontazione, tutela e gestione del patrimonio immobiliare e mobiliare, in proprietà, in locazione e concesso in gestione.</li><li>Attività di gestione del patrimonio immobiliare sede degli Uffici regionali, comprese le sedi non di proprietà regionale: inventariazione, rendicontazione, tutela e manutenzione - Gestione dei relativi contratti.</li><li>Procedure per la dismissione e valorizzazione dei beni immobili in proprietà.</li><li>Gestione dei contratti relativi ai servizi generali.</li><li>Gestione del parco auto in qualsiasi forma detenuto.</li><li>Attività del cerimoniale e gestione delle spese di rappresentanza.</li><li>Attuazione e monitoraggio APQ “E. Gov. e Società dell’informazione interventi FSC”.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A5.01":{"rif":"V.1","titolo":"SERVIZIO COORDINAMENTO PROGRAMMAZIONE COMUNITARIA FONDO FESR – FSE","n":21,"html":"<ol><li>Autorità responsabile dei Piani di Sviluppo e coesione, dei PSR e dei POR.</li><li>Supporto all’Autorità di Gestione (AdG) dei POR FESR FSE Molise.</li><li>Assistenza al Comitato di Sorveglianza di cui all'articolo 47 Reg. 1303/2013.</li><li>Predisposizione di atti amministrativi per la approvazione e pubblicazione dei bandi e avvisi pubblici e dei documenti di accesso ai finanziamenti in forma negoziale da parte dell’AdG.</li><li>Elaborazione e attuazione della Strategia di Comunicazione del POR Molise FESR-FSE 2014-20 e dei relativi Piani attuativi annuali.</li><li>Predisposizione e gestione di un elenco, da redigere secondo le indicazioni di cui all’Allegato XII Reg. 1303/2013, delle operazioni suddivise per programma operativo e per fondo.</li><li>Coordinamento e gestione delle attività di Assistenza Tecnica al PO FESR-FSE Molise 2014-20.</li><li>Coordinamento del sistema di gestione delle irregolarità.</li><li>Gestione contabile del programma operativo conformemente al principio della sana amministrazione finanziaria.</li><li>Istruttoria del processo di modifica del Programma di cui all’art. 30 Reg. 1303/2013.</li><li>Elaborazione delle relazioni di attuazione annuali e finali di cui all'articolo 50 Reg. 1303/2013.</li><li>Istituzione e coordinamento di un sistema informativo di registrazione e conservazione informatizzata dei dati di monitoraggio.</li><li>Elaborazione di procedure e criteri di selezione delle operazioni.</li><li>Predisposizione dei bandi e avvisi pubblici nonché di documenti di costruzione di strategie territoriali comprensivi di pertinente manualistica e modulistica, in raccordo con la pertinente cabina di regia.</li><li>Collaborazione alla preparazione della dichiarazione di affidabilità di gestione e della sintesi annuale di cui all'articolo 59, paragrafo 5, lettere a) e b), del regolamento finanziario.</li><li>Coordinamento nella predisposizione e attuazione del piano di valutazione.</li><li>Creazione e gestione di un sito web unico o di un portale web unico di informazione e pubblicità su tutti i programmi operativi e sull'accesso agli stessi.</li><li>Rapporti con gli Organi Istituzionali europei, nazionali e regionali.</li><li>Responsabile delle Azioni del Patto per lo Sviluppo del Molise – FESR e FSE 2014-2020; risorse PAC 2007-2013 e progetti di completamento.</li><li>Partecipazione, in qualità di componente effettivo, al Tavolo Interfondo.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A5.02":{"rif":"V.2","titolo":"SERVIZIO SUPPORTO ALL’A.D.G. DEL POR FESR-FSE IN MATERIA DI AIUTI E PER PROCEDURE DI APPALTO E ALTRI MACROPROCESSI DIVERSI DAGLI AIUTI","n":19,"html":"<p><em>In relazione alle azioni ascrivibili ai regimi di aiuto, supporto all’Autorità di Gestione (AdG) del POR FESR FSE Molise 2014-2020 per:</em></p><ol><li>Applicazione di procedure valutative e criteri di selezione attraverso l’istruttoria tecnico – amministrativa ed economico-finanziaria delle richieste di finanziamento.</li><li>Predisposizione delle graduatorie provvisorie e/o definitive e dei correlati atti amministrativi da sottoporre all’approvazione e pubblicazione da parte dell’AdG.</li><li>Predisposizione e adozione dei provvedimenti di concessione dei finanziamenti.</li><li>Predisposizione e consegna al beneficiario di un documento contenente le condizioni per il sostegno relative a ciascuna operazione, compresi i requisiti specifici concernenti i prodotti o servizi da fornire nell'ambito dell'operazione, il piano finanziario e il termine per l'esecuzione (disciplinare di concessione).</li><li>Gestione delle domande di pagamento (acconto e saldo) e delle relative rendicontazioni presentate dai beneficiari.</li><li>Attestazione della spesa.</li><li>Segnalazione ai competenti Servizi/Organi di irregolarità e gestione di revoche e recuperi.</li><li>Alimentazione del sistema di monitoraggio, verifica e validazione dei dati inseriti a sistema dai beneficiari degli interventi/operazioni.</li><li>Partecipazione, in qualità di componente effettivo, alla Cabina di regia Aiuti.</li></ol><p><em>In relazione alle azioni ascrivibili a procedure di appalto e ad altri macroprocessi diversi dagli aiuti, supporto all’Autorità di Gestione (AdG) del POR FESR FSE Molise 2014-2020 per:</em></p><ol start=\"10\"><li>Applicazione di procedure valutative e criteri di selezione attraverso l’istruttoria tecnica, amministrativa ed economico-finanziaria delle richieste di finanziamento.</li><li>Predisposizione delle graduatorie provvisorie e/o definitive e dei correlati atti amministrativi da sottoporre all’approvazione e pubblicazione da parte dell’AdG.</li><li>Predisposizione e adozione dei provvedimenti di concessione dei finanziamenti.</li><li>Predisposizione e consegna al beneficiario di un documento contenente le condizioni per il sostegno relative a ciascuna operazione, compresi i requisiti specifici concernenti i prodotti o servizi da fornire nell'ambito dell'operazione, il piano finanziario e il termine per l'esecuzione (disciplinare di concessione).</li><li>Gestione delle domande di pagamento (acconto e saldo) e delle relative rendicontazioni presentate dai beneficiari.</li><li>Attestazione della spesa.</li><li>Segnalazione ai competenti Servizi/Organi di irregolarità e gestione di revoche e recuperi.</li><li>Alimentazione del sistema di monitoraggio, verifica e validazione dei dati inseriti a sistema dai beneficiari degli interventi/operazioni.</li><li>Partecipazione, in qualità di componente effettivo, al Tavolo Interfondo.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A5.03":{"rif":"V.3","titolo":"SERVIZIO COORDINAMENTO FONDO PER LO SVILUPPO E LA COESIONE","n":10,"html":"<ol><li>Coordinamento organizzativo e funzionale dei meccanismi di governo, delle relazioni con le divisioni ministeriali competenti, delle attività di programmazione, riprogrammazione e rimodulazione finanziaria, valutazione, attuazione, sorveglianza e preparazione all’audit, del Programma.</li><li>Coordinamento e raccordo con i responsabili dei procedimenti e degli interventi, con il responsabile delle certificazioni delle spese e del sistema di controllo finanziario del Programma.</li><li>Attività preordinate alla definizione e stipula degli strumenti di cooperazione istituzionale.</li><li>Coordinamento del monitoraggio del programma dal punto di vista economico finanziario e procedurale.</li><li>Predisposizione del Rapporto Annuale degli Obiettivi di Servizio (RAOS).</li><li>Partecipazione ai Tavoli di Coordinamento nazionali e alla elaborazione degli strumenti di programmazione delle politiche di coesione a valere sul Fondo per lo Sviluppo e la Coesione.</li><li>Coordinamento dell’attuazione delle attività di monitoraggio, di sorveglianza e controllo della programmazione delle politiche di coesione regionale; rapporti con l’O.d.C.</li><li>Programmazione e coordinamento dell’attuazione degli strumenti di programmazione del Fondo per lo Sviluppo e la Coesione.</li><li>Partecipazione, in qualità di componente effettivo, al Tavolo Interfondo.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A5.07":{"rif":"V.4","titolo":"SERVIZIO COORDINAMENTO E CONTROLLO PROGETTI PNRR","n":6,"html":"<ol><li>Coordinamento delle procedure gestionali relative all’attivazione dei progetti e definizione delle procedure di gestione e controllo.</li><li>Funzioni di presidio sull’attuazione degli interventi PNRR di competenza regionale e sul raggiungimento dei relativi obiettivi intermedi e finali.</li><li>Coordinamento della gestione finanziaria degli investimenti.</li><li>Vigilanza sull’adozione di criteri di selezione delle azioni coerenti con le regole e gli obiettivi del PNRR e sul rispetto dei vincoli in esso previsti.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li><li>Controlli sulle attività connesse al PNRR.</li></ol>"},"A5.06":{"rif":"V.5","titolo":"SERVIZIO RIFORME ISTITUZIONALI, CONTROLLO ENTI LOCALI E SUB-REGIONALI","n":13,"html":"<ol><li>Raccordo con i Servizi competenti per materia per la predisposizione delle iniziative legislative in ordine alle riforme istituzionali, al processo di federalismo fiscale e all’attuazione dei processi di decentramento.</li><li>Promozione delle iniziative di razionalizzazione del corpus normativo, di semplificazione ed attuazione del principio di sussidiarietà anche in relazione all’analisi di impatto della regolazione.</li><li>Supporto segretariale alla Conferenza Regionale delle Autonomie Locali.</li><li>Programmazione e coordinamento di funzioni e compiti di polizia locale e di sicurezza urbana e del territorio.</li><li>Sviluppo del territorio con la rete degli Enti Locali.</li><li>Gestione dei rapporti e coordinamento delle azioni dell’Associazione Alicomunimolisani.</li><li>Coordinamento e verifica dell’attuazione delle normative regionali da parte degli Enti subregionali, in raccordo con le strutture regionali competenti per le singole materie.</li><li>Controllo tecnico-contabile sui fondamentali atti contabili (bilancio, variazioni, assestamenti, rendiconto) degli Enti sub regionali e strumentali.</li><li>Controllo e monitoraggio contabile-finanziario degli enti sub-regionali, nonché raccordo tra i documenti contabili degli enti con quelli del bilancio regionale.</li><li>Attuazione e monitoraggio interventi FSC APQ “Sicurezza”.</li><li>Attuazione e monitoraggio interventi PAR FSC Molise 2007-2013.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li><li>Adempimenti inerenti alle spese elettorali e referendarie e ai rimborsi a soggetti terzi coinvolti nelle consultazioni.</li></ol>"},"DS.01":{"rif":"G.1","titolo":"SERVIZIO SUPPORTO AL DIRETTORE GENERALE PER LA SALUTE","n":25,"html":"<ol><li>Cura della funzione giuridico-legale e legislativa a supporto della Direzione Generale per la Salute.</li><li>Coordinamento per la Direzione Generale per la Salute, in materia di adempimenti per la tutela della Privacy, Trasparenza e Prevenzione della Corruzione.</li><li>Controllo Atti, verifica collaborativa di regolarità amministrativa e supporto ai fini della redazione delle proposte di deliberazione, dei decreti e degli atti dirigenziali di particolare complessità sotto il profilo giuridico- amministrativo.</li><li>Coordinamento, monitoraggio e rendicontazione per gli adempimenti in materia di performance organizzativa ed individuale, nonché per l'attuazione degli Obiettivi e dei Risultati attesi strategici di competenza della Direzione Generale per la Salute.</li><li>Attività di coordinamento del funzionamento di commissioni e gruppi di lavoro tecnici, di supporto all'attività della Direzione Generale per la Salute.</li><li>Coordinamento e raccordo con i responsabili dei Servizi della Direzione Generale per la Salute.</li><li>Coordinamento, monitoraggio del contenzioso e raccordo con l’Avvocatura Distrettuale dello Stato e l’Avvocatura Regionale, per i contenziosi inerenti alle materie della Direzione Generale per la Salute.</li><li>Coordinamento rapporti con la Gestione Commissariale.</li><li>Gestione degli istituti di competenza relativi alle risorse umane e strumentali della Direzione Generale per la Salute.</li><li>Attività finalizzate alla promozione e al finanziamento della Ricerca Scientifica nell’ambito sanitario: progetti di Ricerca scientifica sanitaria.</li><li>Coordinamento e gestione, su indicazione della Direzione Generale per la Salute, dei rapporti istituzionali tra la Regione e gli Enti del Servizio Sanitario Regionale per le materie di competenza della Direzione e del Servizio.</li><li>Emanazione di linee di indirizzo regionale, attinenti all’assetto organizzativo dell’Azienda Sanitaria Regionale.</li><li>Gestione adempimenti connessi all’approvazione dell’Atto aziendale dell’ASReM.</li><li>Attività di supporto operativo e tecnico per la nomina ed il funzionamento della Conferenza permanente per la Programmazione Sanitaria e Sociosanitaria Regionale.</li><li>Supporto operativo e tecnico al Direttore Generale per la Salute nei procedimenti correlati al rapporto di lavoro del Direttore Generale dell’A.S.Re.M (definizione e assegnazione degli obiettivi, definizione dei criteri di valutazione delle attività, verifica dei risultati conseguiti e del raggiungimento degli obiettivi, risoluzioni e decadenza).</li><li>Coordinamento attuazione adempimenti LEA annuali.</li><li>Coordinamento dell’attività di riscontro inerenti alle interrogazioni, mozioni, interpellanze parlamentari e consiliari.</li><li>Coordinamento riscontri istanze di accesso agli atti.</li><li>Recepimento di atti e/o Intese Stato-Regioni, concernenti atti di indirizzo in merito a specifici aspetti relativi alle materie di competenza del Servizio.</li><li>Partecipazione, su indicazione della Direzione Generale per la Salute, ai tavoli tecnici della Conferenza Stato - Regione e unificata per le materie di competenza.</li><li>Verifica dell’erogazione e mantenimento dei livelli essenziali di assistenza (LEA), nelle materie di competenza del Servizio.</li><li>Gestione del contenzioso, per le materie di competenza del Servizio.</li><li>Riscontro delle interrogazioni, mozioni e interpellanze parlamentari e consiliari per le materie di competenza del Servizio.</li><li>Riscontro istanze di accesso agli atti per le materie del Servizio.</li><li>Interventi a valere sui fondi strutturali e altre risorse nazionali e/o comunitarie per le materie di competenza del Servizio.</li></ol>"},"DS.02":{"rif":"G.2","titolo":"SERVIZIO RISORSE UMANE DEL SSR, FORMAZIONE, ECM","n":32,"html":"<ol><li>Politiche delle risorse umane del Servizio Sanitario Regionale.</li><li>Attività connesse all'applicazione di tutti i CCNL relativi al personale dipendente del SSR ed al personale a rapporto convenzionale.</li><li>Elaborazione delle graduatorie della MMG e dei PLS, sulla base dei criteri individuati nei rispettivi Accordi Collettivi.</li><li>Adempimenti inerenti alle relazioni sindacali, nelle forme e con le modalità previste dai contratti nazionali e dagli accordi collettivi, con le Organizzazioni firmatarie degli stessi.</li><li>Elaborazione, di concerto con le OO.SS. firmatarie degli Accordi Collettivi Nazionali, di tutti gli accordi integrativi demandati alla negoziazione regionale e verifica della corretta e puntuale applicazione degli stessi.</li><li>Interventi in materia di cure primarie.</li><li>Attività preordinate all’ adozione di provvedimenti diretti al contenimento della spesa del personale del S.S.R.</li><li>Attività di supporto operativo e tecnico per le nomine degli Organi dell’Azienda Sanitaria ai sensi della normativa vigente.</li><li>Programmazione dei fabbisogni quali-quantitativi del personale sanitario con lauree magistrali e degli specialisti da formare nelle scuole di specializzazione, nonché dei laureati delle professioni sanitarie.</li><li>Programmazione dei fabbisogni formativi, organizzazione e gestione dei Corsi triennali di Formazione specifica in Medicina Generale (pubblicazione del bando, svolgimento del concorso per l’ammissione al corso, gestione e organizzazione del corso).</li><li>Coordinamento dei percorsi di Formazione manageriale e di iniziative formative istituzionali.</li><li>Supporto amministrativo all’Osservatorio Regionale Formazione Specialistica.</li><li>Adempimenti connessi alla formazione e aggiornamento per il personale dei reparti di ricovero per ammalati AIDS.</li><li>Adempimenti connessi ai corsi regionali per l’esercizio delle arti ausiliarie di ottico e di odontotecnico.</li><li>Predisposizione e monitoraggio di convenzioni, protocolli d’intesa, accordi di programma con le Università, afferenti alla formazione dei profili delle professioni sanitarie ed alle specializzazioni mediche.</li><li>Adempimenti in materia di contratti aggiuntivi regionali, per le specialità mediche.</li><li>Attività di valutazione dell’equivalenza titoli e di riconoscimento dei titoli di studio conseguiti all’estero delle professioni sanitarie.</li><li>Realizzazione, gestione ed implementazione del Programma Regionale di Formazione Continua in Medicina (ECM).</li><li>Programmazione e progettazione del Piano di Formazione Regionale del personale SSR.</li><li>Monitoraggio del piano di formazione dell’Azienda Sanitaria Regionale e dei Provider Regionali.</li><li>Coordinamento delle attività degli organismi di funzionamento della Formazione Continua in Medicina (Commissione Regionale – Osservatorio Regionale Qualità Formazione Continua).</li><li>Adempimenti connessi alla gestione della banca dati Provider ECM accreditati dalla Regione – Anagrafe dei crediti – Dossier formativo del professionista.</li><li>Supporto tecnico e operativo agli organismi del Sistema Nazionale per la Formazione Continua in Medicina.</li><li>Validazione dei flussi informativi di governo per le materie di competenza del Servizio.</li><li>Gestione dei rapporti istituzionali tra la Regione e gli Enti del Servizio Sanitario Regionale per le materie di competenza del servizio, su indicazione della Direzione Generale per la Salute.</li><li>Recepimento di atti e/o Intese Stato-Regioni, concernenti atti di indirizzo in merito a specifici aspetti relativi alle materie di competenza del Servizio.</li><li>Partecipazione, su indicazione della Direzione Generale per la Salute, ai tavoli tecnici della Conferenza Stato - Regione e unificata per le materie di competenza.</li><li>Verifica dell’erogazione e mantenimento dei livelli essenziali di assistenza (LEA), nelle materie di competenza del Servizio.</li><li>Gestione del contenzioso, per le materie di competenza del Servizio.</li><li>Riscontro delle interrogazioni, mozioni e interpellanze parlamentari e consiliari per le materie di competenza del Servizio.</li><li>Riscontro istanze di accesso agli atti per le materie del Servizio.</li><li>Interventi a valere sui fondi strutturali e altre risorse nazionali e/o comunitarie per le materie di competenza del Servizio.</li></ol>"},"DS.03":{"rif":"G.3","titolo":"SERVIZIO AUTORIZZAZIONE E ACCREDITAMENTO","n":18,"html":"<ol><li>Adempimenti connessi al rilascio delle autorizzazioni all'esercizio e dell'accreditamento istituzionale delle strutture sanitarie e sociosanitarie.</li><li>Coordinamento delle attività di verifica sul campo e delle attività ispettive \"ordinarie\" sull'idoneità del personale sanitario, sulla permanenza dei requisiti di cui alla normativa vigente in materia di autorizzazione alla realizzazione di strutture e all'esercizio di attività sanitarie, di accreditamento istituzionale e di accordi contrattuali.</li><li>Cura della fase istruttoria, per il tramite dell’Azienda Sanitaria Regionale per il Molise - ASReM, in ordine alle istanze di ampliamento, trasformazione, trasferimento o rimodulazione della struttura, trasferimento della titolarità, cessione dell'autorizzazione all'esercizio, voltura dell’accreditamento istituzionale, ed ulteriori adempimenti ai sensi della L.R. 18/08 e s.m.i.</li><li>Controllo e vigilanza, per il tramite dell’Azienda Sanitaria Regionale per il Molise- ASReM, sulle strutture ai fini dell'adozione di eventuali provvedimenti di sospensione, revoca e decadenza dell'autorizzazione all'esercizio, nonché sospensione e revoca dell'accreditamento.</li><li>Predisposizione, di concerto con gli altri Servizi competenti, di appositi strumenti di rilevazione, idonei a rappresentare i fenomeni oggetto delle indagini, in maniera organica ed esauriente, in relazione agli obiettivi individuati dal PAAI.</li><li>Definizione e revisione dei requisiti previsti per l'autorizzazione delle strutture sanitarie e sociosanitarie.</li><li>Definizione del sistema di classificazione dei soggetti accreditati, in rapporto al grado di adesione ai requisiti, anche ai fini della differenziazione delle prestazioni erogabili e la loro remunerazione.</li><li>Adempimenti connessi alla formazione specifica e mantenimento competenze dei valutatori.</li><li>Validazione dei flussi informativi di governo per le materie di competenza del Servizio.</li><li>Gestione dei rapporti istituzionali tra la Regione e gli Enti del Servizio Sanitario Regionale per le materie di competenza del servizio, su indicazione della Direzione Generale per la Salute.</li><li>Attività di monitoraggio e verifica di coerenza degli adempimenti posti in essere con gli obiettivi fissati nel Piano di Rientro e nei successivi programmi operativi, nelle materie di competenza del Servizio.</li><li>Recepimento di atti e/o Intese Stato-Regioni, concernenti atti di indirizzo in merito a specifici aspetti relativi alle materie di competenza del Servizio.</li><li>Partecipazione, su indicazione della Direzione Generale per la Salute, ai tavoli tecnici della Conferenza Stato - Regione e unificata per le materie di competenza.</li><li>Verifica dell’erogazione e mantenimento dei livelli essenziali di assistenza (LEA), nelle materie di competenza del Servizio.</li><li>Gestione del contenzioso, per le materie di competenza del Servizio.</li><li>Riscontro delle interrogazioni, mozioni e interpellanze parlamentari e consiliari per le materie di competenza del Servizio.</li><li>Riscontro istanze di accesso agli atti per le materie del Servizio.</li><li>Interventi a valere sui fondi strutturali e altre risorse nazionali e/o comunitarie per le materie di competenza del Servizio.</li></ol>"},"DS.04":{"rif":"G.4","titolo":"SERVIZIO LIVELLI MASSIMI DI FINANZIAMENTO E DELL’INTEGRAZIONE SOCIO-SANITARIA","n":46,"html":"<ol><li>Definizione del sistema tariffario delle prestazioni ospedaliere e territoriali, in raccordo con gli altri Servizi competenti in materia e gestione, stesura ed aggiornamento dei Nomenclatori Tariffari regionali.</li><li>Definizione dei criteri per la determinazione del finanziamento delle funzioni assistenziali ospedaliere e di didattica e ricerca.</li><li>Coordinamento e raccordo con gli organismi nazionali ed internazionali competenti in materia di mobilità sanitaria, su indicazione della Direzione Generale per la Salute.</li><li>Gestione dei dati relativi alla mobilità sanitaria internazionale con gli organismi nazionali allo scopo deputati, e dei dati inerenti alla mobilità sanitaria interregionale attiva e passiva.</li><li>Attività connesse alla stipula e monitoraggio degli accordi con le altre Regioni per la regolazione della mobilità sanitaria interregionale.</li><li>Valutazione, individuazione di una serie di indicatori per la definizione del limite massimo di risorse assegnate per tipologia assistenziale, ivi comprese quelle assegnate nell’ambito delle funzioni assistenziali-ospedaliere e di didattica e ricerca, utili per gli adempimenti di livello nazionale, per verifica degli obiettivi e delle azioni programmate, per le esigenze conoscitive della Direzione Generale per la Salute anche in relazione agli impatti attesi dal Piano di rientro.</li><li>Controllo tecnico- sanitario sulle prestazioni sanitarie erogate dalle strutture regionali.</li><li>Monitoraggio e controllo delle prescrizioni mediche e delle prestazioni specialistiche.</li><li>Definizione del sistema di accesso alle prestazioni sanitarie.</li><li>Attività di verifica per la gestione dell’assistenza integrativa per la riabilitazione sanitaria.</li><li>Attività di controllo tecnico-sanitario per le attività di competenza (SDO/DRG) (A.P.G.) delle strutture equiparate a diretta gestione regionale e delle Strutture Ospedaliere Pubbliche.</li><li>Attività di monitoraggio e verifica dei controlli effettuati dalla ASReM per le Case di Cura Private accreditate di propria competenza e funzioni di Organo di Arbitrato Regionale (cfr. D.C.A. n.03/2010 Disciplinare Tecnico art. 6 Regolamento Par. 8).</li><li>Attività di monitoraggio e controllo Sistema SDO/DRG (3M Grouper) certificazioni e verbali.</li><li>Attività di monitoraggio erogazione A.P.G. (Prestazioni di Medicina Specialistica Ambulatoriale).</li><li>Monitoraggio e controllo dei Farmaci a dispensazione di diretta per la S.M. (Interferone).</li><li>Controllo e Monitoraggio delle prestazioni sanitarie di chemioterapia.</li><li>Attività di controllo e verifica della produzione erogata dalle Strutture a diretta gestione regionale, preordinata all’erogazione degli acconti.</li><li>Verifica dei file della Mobilità sanitaria interregionale attiva e passiva e chiusura degli Accordi interregionali presso il Coordinamento Nazionale Mobilità Sanitaria.</li><li>Gestione e Monitoraggio A.P.P.R.O. Regione Molise (D.G.R. n. 874/2005).</li><li>Definizione e predisposizione di relazioni per prestazioni di Chirurgia Ambulatoriale Complessa o Day Service quale setting alternativo ai ricoveri in D.S. e P.A.C. (Pacchetti Ambulatoriali Complessi medici in alternativa ai ricoveri in D.H).</li><li>Promozione delle attività dirette alla organizzazione e programmazione della rete dei servizi territoriali e delle attività distrettuali, dell’assistenza specialistica ambulatoriale, mediante la promozione dell'appropriatezza organizzativa e della qualità dell'assistenza anche attraverso il trasferimento di attività in setting assistenziali più appropriati.</li><li>Programmazione del ruolo dell’Hospice nella rete oncologica.</li><li>Regolamentazione in materia di day–hospital e day–surgery.</li><li>Coordinamento e sviluppo in materia di politiche sociosanitarie.</li><li>Monitoraggio, verifica e coordinamento in materia di analisi e determinazione del fabbisogno sanitario e sociosanitario.</li><li>Realizzazione e potenziamento del sistema dei servizi sociosanitari per anziani e disabili.</li><li>Integrazione sociosanitaria dell'area della non autosufficienza e della salute mentale.</li><li>Sviluppo della programmazione e delle attività in tema di prevenzione e cura delle dipendenze patologiche.</li><li>Coordinamento e programmazione della medicina penitenziaria.</li><li>Promozione, sviluppo e innovazione nell'ambito del percorso nascita e promozione della qualità dei consultori familiari e consultori pediatrici.</li><li>Promozione della qualità delle attività relative alla neuropsichiatria dell'infanzia e dell'adolescenza e alla salute della donna.</li><li>Assistenza sanitaria agli stranieri.</li><li>Programmazione della rete di assistenza integrata domiciliare, soggetti fragili e cure palliative.</li><li>Assistenza in strutture residenziali e semiresidenziali.</li><li>Attività di indirizzo, coordinamento e controllo in materia di malattie di rilevanza sociale e di assistenza specialistica ospedaliera, delle persone anziane, minori e con disabilità.</li><li>Attuazione e monitoraggio interventi PAR e Obiettivi di Servizio FSC 2007-2013.</li><li>Validazione dei flussi informativi di governo per le materie di competenza del Servizio.</li><li>Gestione dei rapporti istituzionali tra la Regione e gli Enti del Servizio Sanitario Regionale per le materie di competenza del Servizio, su indicazione della Direzione Generale per la Salute.</li><li>Attività di monitoraggio e verifica di coerenza degli adempimenti posti in essere con gli obiettivi fissati nel Piano di Rientro e nei successivi programmi operativi, nelle materie di competenza del Servizio.</li><li>Recepimento di atti e/o Intese Stato-Regioni, concernenti atti di indirizzo in merito a specifici aspetti relativi alle materie di competenza del Servizio.</li><li>Partecipazione, su indicazione della Direzione Generale per la Salute, ai tavoli tecnici della Conferenza Stato - Regione e unificata per le materie di competenza.</li><li>Verifica dell’erogazione e mantenimento dei livelli essenziali di assistenza (LEA), nelle materie di competenza del Servizio.</li><li>Gestione del contenzioso, per le materie di competenza del Servizio.</li><li>Riscontro delle interrogazioni, mozioni e interpellanze parlamentari e consiliari per le materie di competenza del Servizio.</li><li>Riscontro istanze di accesso agli atti per le materie del Servizio.</li><li>Interventi a valere sui fondi strutturali e altre risorse nazionali e/o comunitarie per le materie di competenza del Servizio.</li></ol>"},"DS.05":{"rif":"G.5","titolo":"SERVIZIO CONTROLLO DI GESTIONE E FLUSSI INFORMATIVI","n":26,"html":"<ol><li>Gestione dei dati del Sistema Informativo Sanitario Regionale (SISR) afferenti all’NSIS, all’ISTAT, al MEF ed all’ISS.</li><li>Coordinamento della validazione dei flussi informativi di Governo provenienti dall’ASReM e dalle strutture sanitarie di ricovero private accreditate a diretta gestione regionale.</li><li>Validazione dei flussi informativi di governo per le materie di competenza del Servizio. -</li><li>Contributo per l’individuazione degli indicatori utili per la valutazione dell'appropriatezza delle prestazioni sanitarie erogate.</li><li>Predisposizione di un sistema regionale per il controllo di gestione delle attività sanitarie regionali.</li><li>Sviluppo, in collaborazione con i Servizi della Direzione per la Salute, della reportistica utile per la verifica e l’analisi gestionale dei dati.</li><li>Redazione di statistiche sanitarie.</li><li>Analisi economico-gestionale dei dati aziendali, ai fini del supporto alle attività di programmazione e controllo della Direzione Generale per la Salute.</li><li>Monitoraggio, acquisizione e gestione dei dati elaborati dal Sistema TS (Tessera Sanitaria), al fine di fornire supporto alla Direzione Generale per la Salute per il governo della spesa farmaceutica e delle prestazioni specialistiche.</li><li>Contributo del Servizio per l’alimentazione del Rapporto sull’Innovazione nell’Italia delle Regioni, per la parte sanitaria.</li><li>Implementazione di un sistema informativo sanitario integrato e per il miglioramento del governo dei dati, dalla loro generazione, alla raccolta, alla corretta trattazione degli stessi ed invio agli Organi centrali in coerenza anche dell’evoluzione normativa e regolamentare.</li><li>Progetto MRA (Monitoraggio Rete di Assistenza).</li><li>Progetto Anagrafe Unica degli Assistiti.</li><li>Implementazione, monitoraggio e gestione dei processi per l’alimentazione del Sistema Tessera Sanitaria del MEF.</li><li>Completamento dell’attuazione del Progetto TS (Tessera Sanitaria) e informatizzazione della ricetta medica (Medici in rete) di cui al DPCM 28/3/2008.</li><li>Dematerializzazione della ricetta medica cartacea, di cui al D.M. 2/11/2011.</li><li>Validazione dei flussi informativi di governo per le materie di competenza del Servizio.</li><li>Gestione dei rapporti istituzionali tra la Regione e gli Enti del Servizio Sanitario Regionale per le materie di competenza del Servizio, su indicazione della Direzione Generale per la Salute.</li><li>Attività di monitoraggio e verifica di coerenza degli adempimenti posti in essere con gli obiettivi fissati nel Piano di Rientro e nei successivi programmi operativi, nelle materie di competenza del Servizio.</li><li>Recepimento di atti e/o Intese Stato-Regioni, concernenti atti di indirizzo in merito a specifici aspetti relativi alle materie di competenza del Servizio.</li><li>Partecipazione, su indicazione della Direzione Generale per la Salute, ai tavoli tecnici della Conferenza Stato - Regione e unificata per le materie di competenza.</li><li>Verifica dell’erogazione e mantenimento dei livelli essenziali di assistenza (LEA), nelle materie di competenza del Servizio.</li><li>Gestione del contenzioso, per le materie di competenza del Servizio.</li><li>Riscontro delle interrogazioni, mozioni e interpellanze parlamentari e consiliari per le materie di competenza del Servizio.</li><li>Riscontro istanze di accesso agli atti per le materie del Servizio.</li><li>Interventi a valere sui fondi strutturali e altre risorse nazionali e/o comunitarie per le materie di competenza del Servizio.</li></ol>"},"DS.06":{"rif":"G.6","titolo":"SERVIZIO PROGRAMMAZIONE ECONOMICO FINANZIARIA DEL SSR","n":31,"html":"<ol><li>Cura della fase istruttoria per l’emanazione di direttive finalizzate alla predisposizione dei bilanci economici, budget e del bilancio di esercizio dell’ASReM; controllo e verifica di correttezza e rispetto delle normative contabili.</li><li>Gestione dei rapporti con i Ministeri competenti in ordine alla ripartizione ed assegnazione del fabbisogno finanziario destinato al Servizio Sanitario Regionale, su indicazione della Direzione Generale per la Salute.</li><li>Adempimenti connessi all’attribuzione all’ASReM delle risorse finanziarie assegnate, attraverso la definizione della quota capitaria spettante.</li><li>Attività di indirizzo e direttiva all’ASReM, per la predisposizione del bilancio di previsione annuale, garantendo le necessarie compatibilità tra le risorse finanziarie da assegnare e l'equilibrio economico regionale.</li><li>Monitoraggio mensile dell'andamento dei costi rispetto alle risorse assegnate.</li><li>Elaborazione dei criteri di finanziamento degli enti strumentali del S.S.R.</li><li>Gestione delle procedure di impegno, liquidazione e pagamento dei contratti con i Soggetti Erogatori Accreditati a diretta gestione regionale.</li><li>Gestione degli adempimenti diretti alla assegnazione della liquidità esistente, alla definizione delle posizioni debitorie degli enti del servizio sanitario e del sistema nel suo complesso, assumendo anche conseguenti iniziative in ordine al ripianamento.</li><li>Verifica dell'attività di contabilità analitica nell’ASReM al fine da attuare il controllo della gestione nell'aspetto economico, attraverso la misurazione, la rilevazione, la destinazione e l’analisi dei costi e dei ricavi.</li><li>Attività di controllo della gestione finanziaria dell’ASReM, in raccordo con gli altri Servizi della Direzione Generale per la Salute.</li><li>Validazione dei flussi informativi di governo, provenienti dall’AS.Re.M, per le materie di competenza del Servizio.</li><li>Adempimenti connessi alla gestione “a stralcio” delle ex Unità sanitarie Locali.</li><li>Attività di indirizzo e verifica sui programmi di attività annuale e triennale e dei relativi programmi attuativi dell’ASReM.</li><li>Adempimenti di cui al D.lgs.23 giugno 2011, n 118 e s.m.i e disposizioni attuative.</li><li>Monitoraggio finanziario e controllo di gestione sull’attività dei Servizi della Direzione.</li><li>Patrimonio del Servizio Sanitario Regionale.</li><li>Programmazione, monitoraggio e verifica dello stato di attuazione dei progetti e degli interventi in edilizia sanitaria e di adeguamento tecnologico delle relative strutture.</li><li>Osservatorio Tecnologie Biomediche (OTB) della struttura regionale per gli acquisiti sanitari.</li><li>Autorizzazione all’installazione di apparecchiature sanitarie di particolare complessità.</li><li>Attività di programmazione, in collaborazione con la struttura competente in edilizia e tecnologie sanitarie, per la programmazione degli interventi di edilizia sanitaria e per i programmi di investimento in conto capitale sul territorio anche con riferimento alla introduzione delle alte tecnologie, relativamente alle materie di competenza del Servizio.</li><li>Definizione, dei piani e programmi di investimento in conto capitale anche con riferimento alla introduzione delle alte tecnologie.</li><li>Validazione dei flussi informativi di governo per le materie di competenza del Servizio.</li><li>Gestione dei rapporti istituzionali tra la Regione e gli Enti del Servizio Sanitario Regionale per le materie di competenza del Servizio, su indicazione della Direzione Generale per la Salute.</li><li>Attività di monitoraggio e verifica di coerenza degli adempimenti posti in essere con gli obiettivi fissati nel Piano di Rientro e nei successivi programmi operativi, nelle materie di competenza del Servizio.</li><li>Recepimento di atti e/o Intese Stato-Regioni, concernenti atti di indirizzo in merito a specifici aspetti relativi alle materie di competenza del Servizio.</li><li>Partecipazione, su indicazione della Direzione Generale per la Salute, ai tavoli tecnici della Conferenza Stato - Regione e unificata per le materie di competenza.</li><li>Verifica dell’erogazione e mantenimento dei livelli essenziali di assistenza (LEA), nelle materie di competenza del Servizio.</li><li>Gestione del contenzioso, per le materie di competenza del Servizio.</li><li>Riscontro delle interrogazioni, mozioni e interpellanze parlamentari e consiliari per le materie di competenza del Servizio.</li><li>Riscontro istanze di accesso agli atti per le materie del Servizio.</li><li>Interventi a valere sui fondi strutturali e altre risorse nazionali e/o comunitarie per le materie di competenza del Servizio.</li></ol>"},"DS.07":{"rif":"G.7","titolo":"SERVIZIO POLITICA DEL FARMACO. PROTESICA. INTEGRATIVA. CURE ALL’ESTERO. INDENNIZZI. REGISTRO BLSD","n":55,"html":"<ol><li>Assistenza farmaceutica territoriale ed ospedaliera.</li><li>Politiche di governo della spesa farmaceutica territoriale ed ospedaliera.</li><li>Monitoraggio della spesa farmaceutica.</li><li>Promozione dell’uso corretto dei farmaci innovativi, farmaci ospedalieri (H OSP), farmaci Prontuario Ospedale/Territorio (PHT).</li><li>Progetti di appropriatezza per la razionalizzazione e il contenimento della spesa territoriale, ospedaliera.</li><li>Redazione e aggiornamento Prontuario Terapeutico Ospedaliero Regionale (P.T.O.R.).</li><li>Accreditamento dei Centri per la redazione dei Piani Terapeutici.</li><li>Rete regionale dei comitati etici per la sperimentazione clinica.</li><li>Autorizzazione sanitaria all’attività di deposito all’ingrosso per la vendita dei medicinali per uso umano.</li><li>Processi di gestione contabile relativi a manovra pay back in raccordo con il Servizio Programmazione Economico-Finanziaria del SSR.</li><li>Procedura di rimborso Farmaci a dispensazione di diretta per la S.M. (Interferone);</li><li>Gestione accordi con le rappresentanze sindacali di categoria (Federfarma e Sindacati Medici).</li><li>Informazione medico-scientifica del farmaco: accreditamento informatori medico-scientifici e gestione relazioni account manager.</li><li>Definizione del Sistema di accesso alle prestazioni, nelle materie di competenza del Servizio ed esenzione dalla partecipazione al costo delle relative prestazioni di competenza del Servizio.</li><li>Elaborazione, verifica, attuazione ed aggiornamento dei tariffari regionali delle prestazioni sanitarie di competenza del Servizio.</li><li>Revisione della Pianta Organica delle farmacie.</li><li>Concorsi pubblici, ordinari e straordinari, per l’assegnazione delle sedi farmaceutiche per il privato esercizio.</li><li>Decentramento delle sedi farmaceutiche e Istituzione dei dispensari farmaceutici.</li><li>Regolamentazione dell’attività delle parafarmacie e corner farmaceutici.</li><li>Servizi sociosanitari assicurati dalle farmacie nell’ambito del SSR.</li><li>Nomina delle commissioni farmaceutiche aziendali consultive e di vigilanza.</li><li>Gestione dell’Accordo per la disciplina dei rapporti con le farmacie convenzionate con il SSN.</li><li>Revisione e aggiornamento della normativa regionale in materia di programmazione e organizzazione degli esercizi farmaceutici.</li><li>Coordinamento dell’attività riferita alla sorveglianza epidemiologica e al monitoraggio dell’appropriatezza del trattamento con ormone della crescita (GH).</li><li>Validazione dei flussi informativi di governo per le materie di competenza del Servizio.</li><li>Monitoraggio dei flussi informativi di governo. Macroarea farmaceutica territoriale e ospedaliera.</li><li>Macroarea dispositivi medici.</li><li>Monitoraggio relativo all'attuazione delle disposizioni ministeriali inerenti i dispositivi medici.</li><li>Progetti di appropriatezza per la razionalizzazione e il contenimento della spesa dei dispositivi medici.</li><li>Farmaco vigilanza e farmaco utilizzazione.</li><li>Coordinamento del Centro Regionale di Farmacovigilanza (CRFV).</li><li>Progetti di farmacovigilanza attiva/dispositivi medici.</li><li>Linee di indirizzo/aggiornamento in materia di assistenza integrativa a carico del SSN.</li><li>Linee di indirizzo/aggiornamento in materia di prodotti protesici, ausili tecnici a carico del SSN.</li><li>Redazione e aggiornamento elenco fornitori protesi, ortesi e ausili tecnici.</li><li>Monitoraggio relativo all’attuazione delle disposizioni ministeriali inerenti all’assistenza integrativa e protesica.</li><li>Progetti di appropriatezza per la razionalizzazione e il contenimento della spesa relativa all’assistenza integrativa e protesica.</li><li>Attività di indirizzo all’ASReM, in collaborazione con i competenti Servizi della Direzione Generale per la Salute, relativamente all’applicazione della normativa sulle esenzioni ticket, per le materie di competenza del Servizio.</li><li>Predisposizione delle valutazioni di Health Technology Assessment nell'ambito dei dispositivi medici e degli ausili protesici.</li><li>Assistenza sanitaria a particolari categorie di utenza (Hanseniani, soggetti affetti da fibrosi cistica, diabetici, celiaci).</li><li>Approvvigionamento regionale e fornitura di ricettari SSN e gestione convenzione e contratto con Istituto Poligrafico e Zecca dello Stato – Ministero Economia e Finanze.</li><li>Adempimenti connessi alla attuazione della legge 210 del 1992 e Attività finalizzate alla predisposizione degli atti per l’erogazione di indennizzo a favore dei soggetti danneggiati da complicanze di tipo irreversibile a causa di vaccinazioni, trasfusioni, emoderivati.</li><li>Autorizzazioni e interventi sanitari in regime comunitario e di accordi bilaterali con i Paesi Esteri e istruttoria amministrativa agli organismi tecnici sanitari.</li><li>Assistenza all'estero e definizione di percorsi di autorizzazione con indirizzi di natura amministrativa, e aggiornamento, ai Centri di riferimento. Assistenza indiretta.</li><li>Adempimenti connessi alla legge regionale n. 23/2013 -Diffusione ed utilizzo dei defibrillatori semiautomatici nella regione Molise - accreditamento dei Centri di Formazione BLSD - Registro Regionale dei Centri Accreditati, degli Istruttori di Basic Life Support Defibrillation (n.d.r. BLSD) e dei soggetti Autorizzati all’uso del DAE.</li><li>Validazione dei flussi informativi di governo per le materie di competenza del Servizio.</li><li>Gestione dei rapporti istituzionali tra la Regione e gli Enti del Servizio Sanitario Regionale per le materie di competenza del Servizio, su indicazione della Direzione Generale per la Salute.</li><li>Attività di monitoraggio e verifica di coerenza degli adempimenti posti in essere con gli obiettivi fissati nel Piano di Rientro e nei successivi programmi operativi, nelle materie di competenza del Servizio.</li><li>Recepimento di atti e/o Intese Stato-Regioni, concernenti atti di indirizzo in merito a specifici aspetti relativi alle materie di competenza del Servizio.</li><li>Partecipazione, su indicazione della Direzione Generale per la Salute, ai tavoli tecnici della Conferenza Stato - Regione e unificata per le materie di competenza.</li><li>Verifica dell’erogazione e mantenimento dei livelli essenziali di assistenza (LEA), nelle materie di competenza del Servizio.</li><li>Gestione del contenzioso, per le materie di competenza del Servizio.</li><li>Riscontro delle interrogazioni, mozioni e interpellanze parlamentari e consiliari per le materie di competenza del Servizio.</li><li>Riscontro istanze di accesso agli atti per le materie del Servizio.</li><li>Interventi a valere sui fondi strutturali e altre risorse nazionali e/o comunitarie per le materie di competenza del Servizio.</li></ol>"},"DS.08":{"rif":"G.8","titolo":"SERVIZIO PROGRAMMAZIONE DELLA RETE OSPEDALIERA E DELL’ASSISTENZA SPECIALISTICA AMBULATORIALE","n":29,"html":"<ol><li>Programmazione, Coordinamento e sviluppo in materia di politiche sanitarie;</li><li>Monitoraggio, verifica e determinazione del fabbisogno sanitario per le materie di competenza;</li><li>Attività dirette alla organizzazione e programmazione della rete ospedaliera e dell’assistenza specialistica ambulatoriale;</li><li>Gestione dell’Osservatorio Epidemiologico Regionale.</li><li>Adempimenti connessi allo sviluppo e implementazione a livello territoriale di PDTA.</li><li>Attività di indirizzo, coordinamento e controllo in materia di procreazione medicalmente assistita.</li><li>Attività di indirizzo, coordinamento e controllo in materia di:<ul><li>malattie di rilevanza sociale (diabete, nefropatie, ecc.)</li><li>malattie infettive e diffusive</li><li>assistenza specialistica ospedaliera.</li></ul></li><li>Case della Salute: programmazione.</li><li>Collaborazione con il Servizio Autorizzazione ed Accreditamento per l’attività istruttoria per il rilascio del parere di compatibilità per la realizzazione di strutture di competenza del Servizio, e per le attività connesse a istituzione, trasformazione e soppressione di posti letto.</li><li>Attività di istruttoria tecnica per il parere di coerenza alla programmazione per le conferme e per i riconoscimenti degli Istituti di ricovero e cura a carattere scientifico.</li><li>Definizione degli aspetti organizzativi per migliorare la qualità dell'assistenza ospedaliera (strategie per il governo clinico, progetto ospedale senza dolore ecc.).</li><li>Organizzazione e programmazione del servizio dell'emergenza territoriale e connesse attività di controllo e vigilanza.</li><li>Definizione limiti massimi di finanziamento erogatori privati accreditati.</li><li>Elaborazione, gestione e monitoraggio degli accordi contrattuali tra i soggetti acquirenti ed i soggetti erogatori delle prestazioni e dei servizi sanitari.</li><li>Gestione dei rapporti con Soggetti Erogatori Accreditati comprese le strutture a diretta gestione regionale.</li><li>Monitoraggio liste di attesa.</li><li>Collaborazione con i Servizi competenti per la gestione dei rapporti con le strutture private accreditate per le materie di competenza.</li><li>Coordinamento e monitoraggio delle attività ospedaliere di particolare rilevanza, come i settori emergenza-urgenza, tr
