<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="theme-color" content="#0066cc"/>
<meta name="color-scheme" content="light"/>
<title>Graduazione dei Servizi | Regione Molise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --pa-primary:#0066cc;--pa-primary-dark:#004d99;--pa-primary-darker:#003366;--pa-slim:#00264d;
  --pa-ink:#17324d;--pa-muted:#5c6f82;--pa-line:#d9dadb;--pa-line-soft:#e6e9f2;
  --pa-bg:#f2f5f9;--pa-bg2:#ebeef0;--pa-white:#ffffff;
  --pa-success:#008758;--pa-success-bg:#e6f4ed;--pa-warning:#a66300;--pa-warning-bg:#fff3cd;
  --pa-danger:#d9364f;--pa-danger-bg:#fdeaed;--pa-info:#0066cc;--pa-info-bg:#e8f0fe;
  --pa-focus:#ff9900;
  --font:'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pa-bg:#f2f5f9}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--pa-bg);color:var(--pa-ink);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--pa-primary)}
h1,h2,h3,h4{line-height:1.2;font-weight:700;color:var(--pa-ink)}
:focus-visible{outline:2px solid var(--pa-focus);outline-offset:2px}
input,select,textarea{border:1px solid #8a9aab;border-radius:4px;background:#fff;padding:8px 10px;width:100%;font-size:14px;line-height:1.35}
input[type="checkbox"],input[type="radio"]{width:auto;padding:0;margin:0;accent-color:var(--pa-primary);width:18px;height:18px;vertical-align:middle;cursor:pointer}
input[type="number"]{font-family:var(--mono);font-size:13px}
input:disabled,select:disabled,textarea:disabled{background:var(--pa-bg2);color:#4a5a6a;cursor:not-allowed}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--pa-primary);box-shadow:0 0 0 3px rgba(0,102,204,.18);outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─ Header (Bootstrap Italia layout: slim / center / nav) ─ */
.hdr-slim{background:var(--pa-slim);color:#fff;font-size:13px;padding:0 20px;height:38px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-slim a,.hdr-slim button{color:#fff}
.hdr-slim .ente{font-weight:600;letter-spacing:.2px}
.hdr-center{background:var(--pa-primary);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px}
.hdr-center img{width:56px;height:57px;background:#fff;border-radius:4px;padding:3px;flex:none}
.hdr-center .t1{font-size:22px;font-weight:700;line-height:1.15}
.hdr-center .t2{font-size:13px;opacity:.92;margin-top:2px;font-weight:400}
.hdr-nav{background:var(--pa-primary-dark);padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.hdr-nav button{background:none;border:none;color:#fff;padding:12px 16px;font-weight:600;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;opacity:.88}
.hdr-nav button:hover{opacity:1;background:rgba(255,255,255,.06)}
.hdr-nav button.on{opacity:1;border-bottom-color:#fff;background:rgba(255,255,255,.1)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);color:#fff}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#7fd6a5}
.pill .dot.sync{background:#ffcc66;animation:blink 1s infinite}
.pill .dot.local{background:#c6cdd3}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.pill .dot.sync{animation:none}}

main{max-width:1180px;margin:0 auto;padding:22px 20px 40px;width:100%}
footer{background:var(--pa-ink);color:#c8d0d8;font-size:12.5px;padding:20px;line-height:1.6}
footer .f1{color:#fff;font-weight:600}
footer .f2{opacity:.75;margin-top:4px}

/* ─ Components ─ */
.card{background:#fff;border:1px solid var(--pa-line);border-radius:4px}
.card .card-h{padding:12px 16px;border-bottom:1px solid var(--pa-line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .card-h h2,.card .card-h h3{font-size:17px}
.card .card-b{padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:4px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;text-decoration:none;background:#fff;color:var(--pa-primary);border-color:var(--pa-primary)}
.btn:hover{background:var(--pa-info-bg)}
.btn.p{background:var(--pa-primary);color:#fff}
.btn.p:hover{background:var(--pa-primary-dark)}
.btn.s{background:var(--pa-success);color:#fff;border-color:var(--pa-success)}
.btn.s:hover{filter:brightness(.92)}
.btn.d{background:#fff;color:var(--pa-danger);border-color:var(--pa-danger)}
.btn.d:hover{background:var(--pa-danger-bg)}
.btn.g{background:#fff;color:var(--pa-ink);border-color:#8a9aab}
.btn.g:hover{background:var(--pa-bg2)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.xs{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{border:none;background:none;padding:4px 6px;text-decoration:underline;font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:3px;font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap}
.badge.bozza{background:var(--pa-bg2);color:#4a5a6a}
.badge.inviata{background:var(--pa-info-bg);color:var(--pa-primary)}
.badge.da_integrare{background:var(--pa-warning-bg);color:var(--pa-warning)}
.badge.validata{background:var(--pa-success-bg);color:var(--pa-success)}
.badge.assente{background:#fff;color:var(--pa-danger);border:1px solid var(--pa-danger)}
.badge.fascia-E{background:var(--pa-success-bg);color:var(--pa-success)}
.badge.fascia-R{background:var(--pa-info-bg);color:var(--pa-primary)}
.badge.fascia-S{background:var(--pa-warning-bg);color:var(--pa-warning)}
.badge.ruolo{background:var(--pa-slim);color:#fff}
.alert{padding:12px 16px;border-radius:4px;border:1px solid;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert.info{background:var(--pa-info-bg);border-color:#b6d0f0;color:#0b3d75}
.alert.warn{background:var(--pa-warning-bg);border-color:#ffe08a;color:#664200}
.alert.err{background:var(--pa-danger-bg);border-color:#f3b6bf;color:#8a1f30}
.alert.ok{background:var(--pa-success-bg);border-color:#a9dcc3;color:#0a5a3c}
.toast{position:fixed;top:14px;right:14px;z-index:9999;padding:12px 18px;border-radius:4px;color:#fff;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:360px}
.toast.ok{background:var(--pa-success)}.toast.err{background:var(--pa-danger)}.toast.info{background:var(--pa-primary)}
.modal-bg{position:fixed;inset:0;background:rgba(23,50,77,.55);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:6px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal.wide{max-width:900px}
.modal .m-h{padding:14px 18px;border-bottom:1px solid var(--pa-line);font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.modal .m-b{padding:18px}
.modal .m-f{padding:12px 18px;border-top:1px solid var(--pa-line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:#fff;border:1px solid var(--pa-line);border-left:5px solid var(--pa-primary);border-radius:4px;padding:12px 14px}
.kpi .v{font-size:30px;font-weight:700;line-height:1;color:var(--pa-ink);font-family:var(--mono)}
.kpi .l{font-size:13px;color:var(--pa-muted);margin-top:6px;font-weight:600}
.kpi.ok{border-left-color:var(--pa-success)}.kpi.warn{border-left-color:var(--pa-warning)}.kpi.err{border-left-color:var(--pa-danger)}.kpi.grey{border-left-color:#8a9aab}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
table.tbl th,table.tbl td{border:1px solid var(--pa-line);padding:7px 9px;text-align:left;vertical-align:top}
table.tbl th{background:#f0f4f8;color:var(--pa-primary-darker);font-weight:700;font-size:12.5px}
table.tbl tr:hover td{background:#fafcff}
table.tbl td.num,table.tbl th.num{text-align:right;font-family:var(--mono);font-size:13px}
table.tbl input,table.tbl select,table.tbl textarea{padding:5px 7px;font-size:13px}
table.tbl textarea{min-height:36px}
.tbl-wrap{overflow-x:auto;border-radius:4px}
.sec{margin-top:18px;border:1px solid var(--pa-line);border-radius:4px;background:#fff}
.sec > .sec-h{background:var(--pa-primary-darker);color:#fff;padding:10px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;border-radius:4px 4px 0 0}
.sec > .sec-h .tag{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:3px;font-weight:500}
.sec > .sec-b{padding:16px}
.sub{font-weight:700;color:var(--pa-primary-darker);font-size:14.5px;margin:16px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub:first-child{margin-top:0}
.tipo{font-family:var(--mono);font-size:11px;background:var(--pa-info-bg);color:var(--pa-primary);padding:1px 6px;border-radius:3px;font-weight:500}
.field{margin-bottom:12px}
.field > label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px;color:var(--pa-ink)}
.field .help{font-size:12.5px;color:var(--pa-muted);margin-top:4px;line-height:1.4}
.field .help em{color:#3d5266}
.hint-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--pa-primary);color:var(--pa-primary);background:#fff;font-size:11px;font-weight:700;cursor:pointer;vertical-align:middle;margin-left:6px;line-height:1;font-family:Georgia,serif;font-style:italic}
.hint-btn.on{background:var(--pa-primary);color:#fff}
.hint-box{background:var(--pa-info-bg);border-left:4px solid var(--pa-primary);padding:10px 12px;font-size:13px;margin:6px 0 10px;border-radius:0 4px 4px 0;line-height:1.5}
.hint-box b{color:var(--pa-primary-darker)}
.hint-box .ex{display:block;margin-top:6px;color:#3d5266;font-style:italic}
.hint-box .err{display:block;margin-top:6px;color:#8a1f30}
.rte{border:1px solid #8a9aab;border-radius:4px;background:#fff}
.rte:focus-within{border-color:var(--pa-primary);box-shadow:0 0 0 3px rgba(0,102,204,.18)}
.rte-bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--pa-line);background:#f5f7fa;border-radius:4px 4px 0 0}
.rte-bar button{border:1px solid transparent;background:none;border-radius:3px;padding:4px 8px;font-size:13px;font-weight:600;color:var(--pa-ink);cursor:pointer;line-height:1.2}
.rte-bar button:hover{background:#e3e9f0;border-color:#c9d3dd}
.rte-bar .sep{width:1px;height:20px;background:var(--pa-line);margin:0 4px}
.rte-area{min-height:180px;max-height:520px;overflow:auto;padding:10px 14px;font-size:14px;line-height:1.5;outline:none}
.rte-area:empty:before{content:attr(data-ph);color:#8a9aab;pointer-events:none}
.rte-area ol,.rte-view ol,.rte-area ul,.rte-view ul{margin:4px 0 4px 26px;padding:0}
.rte-area li,.rte-view li{margin:3px 0;padding-left:2px}
.rte-area ol ol,.rte-view ol ol{list-style-type:lower-alpha}
.rte-area p,.rte-view p{margin:6px 0}
.rte-view{border:1px solid var(--pa-line);border-radius:4px;background:#fafbfc;padding:10px 14px;font-size:14px;line-height:1.5;max-height:520px;overflow:auto}
.rte-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:6px 10px;border-top:1px solid var(--pa-line-soft);font-size:12.5px;color:var(--pa-muted)}
.chk{display:flex;flex-wrap:wrap;gap:8px 18px;padding:4px 0}
.chk label{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;padding:4px 0}
.tot{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:3px}
.tot.ok{background:var(--pa-success-bg);color:var(--pa-success)}
.tot.ko{background:var(--pa-danger-bg);color:var(--pa-danger)}
.bar{height:9px;background:var(--pa-bg2);border-radius:5px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pa-primary)}
.bar > i.ok{background:var(--pa-success)}.bar > i.warn{background:var(--pa-warning)}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--pa-line-soft);flex-wrap:wrap}
.list-row:last-child{border-bottom:none}
.list-row .code{font-family:var(--mono);font-size:12.5px;color:var(--pa-muted);min-width:70px}
.list-row .name{flex:1;min-width:220px;font-weight:600;font-size:14px}
.list-row .meta{font-size:12.5px;color:var(--pa-muted)}
.list-row.click{cursor:pointer}.list-row.click:hover{background:#f7f9fc}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.steps button{background:#fff;border:1px solid var(--pa-line);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--pa-muted)}
.steps button.on{background:var(--pa-primary-darker);color:#fff;border-color:var(--pa-primary-darker)}
.steps button.done{border-color:var(--pa-success);color:var(--pa-success)}
.steps button.ko{border-color:var(--pa-danger);color:var(--pa-danger)}
.sticky-actions{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(4px);border-top:1px solid var(--pa-line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px -20px -40px;padding-left:20px;padding-right:20px;z-index:50}
.login-wrap{max-width:440px;margin:40px auto}
.login-wrap h1{font-size:22px;margin-bottom:4px}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--pa-muted)}
.small{font-size:12.5px}
.right{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.fo-card{border:1px solid var(--pa-line);border-radius:4px;margin-bottom:12px;background:#fff}
.fo-card .fo-h{background:#f0f4f8;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--pa-line)}
.fo-card .fo-h .fo-id{font-family:var(--mono);font-weight:700;color:var(--pa-primary-darker);background:#fff;border:1px solid var(--pa-line);padding:2px 8px;border-radius:3px;font-size:12px}
.fo-card .fo-h .fo-n{font-weight:700;flex:1;min-width:200px}
.fo-card .fo-h .fo-p{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--pa-primary)}
.fo-card .fo-b{padding:12px 14px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
.fo-card .fo-b .full{grid-column:1/-1}
.evid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;align-items:center}
.evid .k{color:var(--pa-muted)}
.evid .v{font-weight:700;font-family:var(--mono);font-size:12.5px;text-align:right}
.print-only{display:none}
@media (max-width:760px){
  .hdr-center .t1{font-size:17px}.hdr-center img{width:44px;height:45px}
  main{padding:14px 12px 40px}
  .fo-card .fo-b{grid-template-columns:1fr}
  .sticky-actions{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>

/* ════════════════════════════════════════════════════════════════════════

            "firebase"   Firebase Authentication + Cloud Firestore
            "sharepoint" liste di SharePoint Online (web part SPFx)

  ufficio: "Ufficio Programmazione strategica - Performance organizzativa - Coordinamento controlli interni - Controllo Strategico",
  supportEmail: "supporto.dg@regione.molise.it",
  firebase: {
     apiKey: "AIzaSyCD2J0xMgvb3JRpDALrZYJCVVUIPf_NyWM",
  authDomain: "graduazione-molise.firebaseapp.com",
  projectId: "graduazione-molise",
  storageBucket: "graduazione-molise.firebasestorage.app",
  messagingSenderId: "796904117074",
  appId: "1:796904117074:web:8587229d384fb5f901208b"
  },
  sharepoint: {
    siteUrl: "",            // es. https://tenant.sharepoint.com/sites/graduazione ; vuoto = sito corrente
    listPrefix: "GRS_",     // GRS_Schede, GRS_Valutazioni, GRS_Utenti, GRS_Servizi, GRS_Impostazioni
    autoLoginConSharePoint: true,
    pollingSecondi: 60
  }

window.HINTS = {
  regole:{t:"Compilare con riferimento alla situazione organizzativa vigente alla data della rilevazione. Utilizzare dati ricavabili da atti, documenti organizzativi, relazioni o sistemi gestionali; quando il dato analitico non è disponibile è ammessa una stima ragionevole. Le percentuali devono totalizzare il 100%. La scheda non attribuisce punteggi: fornisce elementi conoscitivi al NIV.",e:"In caso di dubbio, preferire un'informazione sintetica ma chiara, evitando descrizioni generiche o autocelebrative."},
  A:{t:"La sezione identifica la struttura oggetto della rilevazione: indicare esclusivamente la Direzione Generale, il Servizio e la data di chiusura della scheda.",e:"Direzione Generale Bilancio - Servizio Programmazione Strategica - Data 15/09/2026",err:"Non utilizzare denominazioni abbreviate né inserire nominativi o riferimenti personali."},
  Adecl:{t:"Riportare l'elenco numerato delle funzioni attribuite al Servizio dalla declaratoria approvata con la DGR indicata sopra, nell'ordine e con la formulazione dell'atto, una funzione per voce. Si può incollare il testo copiato dal PDF dell'Atto di organizzazione: le voci vengono separate e numerate automaticamente. Il pulsante «Riporta la declaratoria dell'Atto di organizzazione» inserisce il testo vigente, da verificare prima dell'invio. Se il Servizio non ha una declaratoria propria, scrivere «non applicabile» e motivare.",e:"1. Supporto al Direttore generale nell'esercizio delle funzioni proprie... 2. Coordinamento delle attività dei Servizi della Direzione... 3. Coordinamento dei controlli interni.",err:"Non riassumere né accorpare le funzioni: il numero delle voci è un'evidenza istruttoria per il fattore FO1."},
  B1:{t:"Uffici previsti: uffici formalmente incardinati nel Servizio dall'assetto vigente. In titolarità: affidati a un responsabile titolare. Ad interim: affidati temporaneamente a soggetto già titolare di altro incarico. Vacanti: privi di responsabile incaricato.",e:"Uffici previsti 4 - Titolarità 2 - Interim 1 - Vacanti 1",err:"La somma di titolarità, interim e vacanti deve corrispondere agli uffici previsti."},
  B2:{t:"Previsti: dotazione teorica o programmata. Assegnati: personale formalmente assegnato. Disponibili: personale concretamente utilizzabile, al netto di part-time, assenze lunghe, comandi o altre riduzioni significative. La distinzione tra assegnati e disponibili rappresenta la capacità operativa reale del Servizio.",e:"Istruttori: previsti 6, assegnati 5, disponibili 4 (uno in comando)."},
  B3:{t:"Programmazione: strategie, piani, programmi, obiettivi (DEFR, PIAO, FSC, UE). Regolazione: regolamenti, direttive, linee guida. Gestione: attuazione amministrativa, finanziaria o tecnica (contributi, autorizzazioni, liquidazioni). Monitoraggio: rilevazione e verifica dell'avanzamento. Controllo: verifica, vigilanza, valutazione (audit, controllo strategico). Coordinamento: integrazione tra strutture e processi (tavoli, cabine di regia).",e:"Programmazione 30% - Regolazione 10% - Gestione 35% - Monitoraggio 5% - Controllo 10% - Coordinamento 10%",err:"Il totale deve essere pari al 100%."},
  C1:{t:"Indicare solo i procedimenti e le attività maggiormente rappresentativi (massimo 10), con denominazione comprensibile. Classe A (strategiche): indirizzo, programmazione, regolazione, controllo strategico, coordinamento complesso; elevata discrezionalità, impatto su più strutture. Classe B (specialistiche): valutazioni tecnico-amministrative, istruttorie complesse, applicazione specialistica di norme. Classe C (standardizzate): attività seriali, ripetitive, fortemente proceduralizzate.",e:"Predisposizione DEFR (A - Alta - Annuale); Monitoraggio PIAO (A - Media - Periodica); Accesso agli atti (C - Bassa - Giornaliera).",err:"Non attribuire tutte le attività alla Classe A: riduce l'attendibilità della classificazione."},
  C2:{t:"Ripartizione percentuale delle attività per classe. Strategiche: indirizzo, pianificazione, regolazione, programmazione o coordinamento. Specialistiche: valutazioni tecniche o competenze professionali specifiche. Standardizzate: attività ricorrenti, seriali, con margine decisionale ridotto.",e:"A = 45%, B = 35%, C = 20%",err:"Il totale deve essere pari al 100%."},
  C3:{t:"Elevata discrezionalità: attività in cui non esiste una soluzione predeterminata e sono richieste valutazioni qualificate. Attività specialistiche: complessità derivante dal quadro normativo o tecnico di riferimento. Attività standardizzate: ricorrenti, procedurali, ad elevata ripetitività.",e:"Discrezionalità 40% - Specialistiche 40% - Standardizzate 20%",err:"Il totale deve essere pari al 100%."},
  C4:{t:"Indicare le attività a maggiore complessità tecnico-decisionale con una motivazione breve e pertinente. Se un'attività ha elementi sia strategici sia gestionali, attribuire la classe prevalente in C.1 e spiegare qui la complessità.",e:"Predisposizione PIAO - coinvolgimento dell'intera Amministrazione; Programmazione FSC - responsabilità multilivello e rischio di perdita finanziamenti."},
  D1:{t:"Gli output sono i prodotti più rappresentativi dell'attività svolta (massimo 5): non tutti gli atti adottati, ma gli esiti maggiormente caratterizzanti. Strategici: DEFR, PIAO, piani, regolamenti. Specialistici: pareri, autorizzazioni complesse, relazioni tecniche. Standardizzati: liquidazioni, certificazioni, registrazioni.",e:"PIAO, DEFR, Relazione controllo strategico, Direttive organizzative, Report monitoraggio."},
  D2:{t:"Ripartizione percentuale degli output per tipologia.",e:"Strategici 50% - Specialistici 30% - Standardizzati 20%",err:"Il totale deve essere pari al 100%."},
  E1:{t:"Selezionare più opzioni solo se il rapporto è stabile, ricorrente e funzionale alle attività del Servizio.",e:"Ministeri, Enti regionali, Comuni.",err:"Non inserire contatti occasionali: sovrastima la complessità relazionale."},
  E2:{t:"Indicare i livelli ai quali si sviluppano le relazioni del Servizio e selezionare il livello prevalente (uno solo).",e:"Livelli: Nazionale, Regionale - Prevalente: Regionale."},
  E3:{t:"Indicare fino a cinque attività effettivamente svolte con funzione di coordinamento, con ambito e soggetti coinvolti.",e:"Coordinamento PIAO - ambito regionale - tutte le Direzioni Generali; Tavolo monitoraggio FSC - ambito nazionale - Ministero e Regione."},
  E4:{t:"Indicare il numero di tavoli permanenti, gruppi di lavoro e cabine di regia effettivamente presidiati, se presenti.",e:"Tavoli permanenti 2 - Gruppi di lavoro 3 - Cabine di regia 1"},
  E5:{t:"Selezionare un solo ruolo prevalente: attuazione, coordinamento, indirizzo o controllo.",e:"Un Servizio di supporto strategico indicherà tipicamente Coordinamento o Indirizzo."},
  F1:{t:"Selezionare SI se il Servizio gestisce direttamente o coordina risorse finanziarie rilevanti.",e:""},
  F2:{t:"Selezionare una sola fascia, in base all'ordine di grandezza prevalente delle risorse gestite. Non sono richiesti importi puntuali.",e:"Servizio che gestisce annualmente circa 25 milioni di euro: fascia 10-50 M€."},
  F3:{t:"Sono ammesse più scelte se il Servizio gestisce risorse di natura diversa.",e:"Bilancio regionale, FSC, Fondi UE."},
  F4:{t:"Descrivere sinteticamente le responsabilità esercitate: gestione, monitoraggio, rendicontazione, controllo, ecc.",e:"Gestione fondi FSC; monitoraggio finanziario degli interventi; verifica della rendicontazione; raccordo con amministrazioni centrali."},
  G1:{t:"Sono ammesse più scelte, purché riferite ad ambiti professionali effettivamente ricorrenti.",e:"Giuridico, Economico-finanziario, Programmazione e controllo."},
  G2:{t:"Indicare fino a cinque competenze specialistiche caratterizzanti.",e:"Programmazione strategica; contabilità armonizzata; fondi europei; diritto amministrativo; controllo di gestione."},
  G3:{t:"Selezionare un solo livello in base al numero di ambiti professionali ordinariamente coinvolti.",e:""},
  G4:{t:"Indicare, se rilevante, il numero di abilitazioni professionali o iscrizioni ad Albi necessarie per lo svolgimento delle attività.",e:"Abilitazioni richieste 2 (ingegnere, geologo) - Iscrizioni ad Albi 2."},
  H:{t:"Critica: funzione difficilmente sostituibile, competenze rare o impatto sistemico in caso di interruzione. Rilevante: sostituibile solo con affiancamento o competenze specifiche non diffuse. Ordinaria: sostituibile con personale interno dotato di competenze comuni. Supporto: attività facilmente riallocabile.",e:"Le attività di programmazione strategica e controllo richiedono competenze specialistiche non immediatamente sostituibili all'interno dell'Amministrazione."},
  I1:{t:"Danno erariale: pregiudizio economico per l'Amministrazione. Perdita finanziamenti: revoca, definanziamento, disimpegno. Contenzioso: controversie giudiziarie o stragiudiziali. Interruzione servizi: compromissione di funzioni essenziali. Responsabilità nazionali/europee: obblighi verso Ministeri, Commissione europea o altri organismi. Emergenze: situazioni straordinarie o interventi urgenti.",e:""},

window.DECLARATORIE={"PR.PN.02":{"rif":"A.1","titolo":"SERVIZIO DI GABINETTO DEL PRESIDENTE DELLA REGIONE E DEGLI AFFARI ISTITUZIONALI","n":13,"html":"<ol><li>Rapporti con il Consiglio regionale, coordinamento, monitoraggio e gestione delle interrogazioni, interpellanze, mozioni e ordini del giorno anche mediante interlocuzioni con le strutture regionali interessate per materia.</li><li>Adempimenti amministrativi per l’elezione del Consiglio regionale e del Presidente della Giunta regionale ai sensi della L.R. n. 20/2017 e consultazioni referendarie di competenza regionale.</li><li>Attività di rappresentanza della Regione Molise presso gli uffici di Roma.</li><li>Gestione della comunicazione istituzionale del Presidente.</li><li>Supervisione e coordinamento della home page del sito web istituzionale e delle pagine social regionali.</li><li>Attribuzioni regionali in materia di persone giuridiche private.</li><li>Concessione del patrocinio gratuito e dell’utilizzo dello stemma logo regionale.</li><li>Redazione e pubblicazione del Bollettino Ufficiale della Regione Molise.</li><li>Predisposizione atti relativi alle designazioni e nomine negli organi di amministrazione e di controllo di competenza della Giunta regionale e del Presidente della Regione dei seguenti Enti: ARPA Molise (Revisore dei Conti), ARSARP (Commissario straordinario), ARPA Molise (Revisore dei Conti), IRESMO (Presidente Consiglio Direttivo), II.AA.CC.PP. di Campobasso e Isernia (Commissario liquidatore e Commissario straordinario ErES), Consorzio di Bonifica della Piana di Venafro (Revisore unico), Camera di Commercio (Membro effettivo e membro supplente Collegio revisore dei Conti), Fondazione Molise Cultura (Consiglio di Amministrazione, Revisore dei Conti).</li><li>Supporto al Garante regionale dei diritti della persona ex L.R. n. 17/2015.</li><li>Nomina dei Consiglieri e del Portavoce del Presidente ai sensi del Reg. reg. n. 1/2002.</li><li>Rapporti istituzionali con Enti e Associazioni di rango nazionale per l'esercizio delle attività istituzionali del Presidente e con compiti di raccordo e coordinamento dell'attività complessiva della Regione per la realizzazione degli obiettivi programmatici (Formez, Itaca, Cinsedo, Svimez etc.).</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"PR.PD.02":{"rif":"A.2","titolo":"SERVIZIO AUTORITA’ DI AUDIT","n":10,"html":"<ol><li>Esercizio delle funzioni di cui all’art. 127 del reg. UE 1303/2013 per la programmazione regionale 2014/2020, in particolare:</li><li>Garantisce lo svolgimento di attività di audit sul corretto funzionamento del sistema di gestione e controllo del programma operativo regionale FESR- FSE 2014/2020.</li><li>Garantisce che il lavoro di audit tenga conto degli standard riconosciuti a livello internazionale in materia.</li><li>Adotta una strategia di audit per lo svolgimento delle attività di competenze. La strategia di audit definisce la metodologia di audit, il metodo di campionamento per le attività di audit sulle operazioni e la pianificazione delle attività di audit.</li><li>Verifica la correttezza delle spese dichiarate, nonché la loro conformità alle norme comunitarie e nazionali, attraverso gli audit delle operazioni da effettuare su un campione adeguato di operazioni.</li><li>Verifica la completezza, l’accuratezza e la veridicità degli importi dichiarati attraverso audit dei conti.</li><li>Formula un parere di audit a norma dell'articolo 59, paragrafo 5, secondo comma, del regolamento finanziario.</li><li>Formula la relazione di controllo che evidenzia le principali risultanze delle attività di audit svolte a norma del paragrafo 1, del Reg. 1303/2013.</li><li>Svolge i controlli interni di regolarità amministrativa per gli atti e i provvedimenti della Regione Molise.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"PR.PA.02":{"rif":"A.3","titolo":"SERVIZIO CENTRALE UNICA DI COMMITTENZA","n":9,"html":"<ol><li>Gestione delle procedure contrattuali e di appalto, per la realizzazione di lavori pubblici e l’acquisizione di beni e servizi a favore dell’amministrazione regionale e degli enti del Sistema Regione, degli enti locali della Regione e degli enti del Servizio Sanitario regionale.</li><li>Funzioni di consulenza e di supporto nelle procedure di aggiudicazione svolte direttamente dai predetti soggetti.</li><li>Funzioni di soggetto aggregatore ai sensi dell’art. 9, comma 1, del decreto-legge 24 aprile 2014, n. 66 (Misure urgenti per la competitività e la giustizia sociale), convertito, con modificazioni, dalla legge 23 giugno 2014, n. 89.</li><li>Stipula di convenzioni quadro.</li><li>Osservatorio regionale dei Contratti Pubblici e rapporti con l'Autorità per la Vigilanza sui Contratti Pubblici.</li><li>Gestione elenco interno dei Professionisti ai sensi della normativa in materia di contratti pubblici relativi a lavori, servizi e forniture.</li><li>Albo fornitori.</li><li>Repertorio gestione centralizzata dei contratti relativi a beni e servizi.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"PR.PF.02":{"rif":"A.4","titolo":"SERVIZIO AVVOCATURA REGIONALE","n":11,"html":"<ol><li>Rappresentanza e difesa della Regione dinanzi alle giurisdizioni di ogni ordine e grado, ai collegi arbitrali e nei procedimenti extragiudiziali di soluzione delle controversie.</li><li>Consulenza giuridico-legale alla Giunta regionale e alle sue strutture di gestione, nonché agli enti subregionali e strumentali del Sistema Molise, anche in ordine a reclami o questioni che possono costituire oggetto di controversie nonché in ordine all’instaurazione dei giudizi, alla rinuncia alle liti e agli atti di transazione sulla base delle relazioni istruttorie dei Servizi titolari delle relative attribuzioni per materia.</li><li>Consulenza ai fini dell’iniziativa legislativa della Giunta regionale e per la redazione di articolati normativi.</li><li>Coordinamento degli affari affidati a professionisti legali esterni all’Ente.</li><li>Azioni esecutive secondo il codice di procedura civile</li><li>Gestione dei procedimenti relativi alla concedibilità del patrocinio legale e al pagamento delle spese giudiziarie.</li><li>Gestione dei procedimenti sanzionatori ex lege n. 689/1981.</li><li>Consulenza in materia di contratti.</li><li>Coordinamento dei rapporti tra le strutture regionali e l’Avvocatura distrettuale dello Stato;</li><li>Parere di legittimità sulle proposte di deliberazione di giunta regionale di approvazione di disegni di legge di iniziativa giuntale e di regolamenti.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"PR.PO.02":{"rif":"A.5","titolo":"SERVIZIO RENDICONTAZIONE, CONTROLLO E VIGILANZA","n":18,"html":"<ol><li>Coordinamento controlli in itinere ed ex post di 1° livello relativamente ai fondi comunitari e al FSC 2014- 2020.</li><li>Definizione di strumenti per il monitoraggio, il controllo, la rendicontazione e la valutazione.</li><li>Controllo sul mantenimento dei requisiti di iscrizione all’albo per le associazioni di promozione sociale, per le organizzazioni di volontariato, per le associazioni combattentistiche e d’armi, per le cooperative e per le società di mutuo soccorso.</li><li>Attività di vigilanza, controllo e rendicontazione sui Piani regionali sociali di zona e sulle strutture socioassistenziali ai sensi della legge 328/2000 e della legge regionale n. 13/2014.</li><li>In relazione alle azioni ascrivibili a regimi di aiuto, supporto all’Autorità di Gestione (AdG) del POR FESR- FSE Molise 2014-2020 e del Patto per lo Sviluppo della Regione Molise FSC 2014-2020 per:</li><li>Verifica dell’effettiva fornitura dei prodotti e servizi cofinanziati; pagamento, da parte dei beneficiari, delle spese dichiarate, conformi al diritto applicabile, al programma operativo e alle condizioni per il sostegno dell'operazione; tali verifiche comprendono: verifiche amministrative rispetto a ciascuna domanda di rimborso presentata dai beneficiari; verifiche sul posto delle operazioni. Le verifiche sul posto di singole operazioni possono essere svolte a campione.</li><li>Verifica del mantenimento, a cura dei beneficiari, di un sistema di contabilità separata o di una codificazione contabile adeguata a tutte le transazioni relative a un'operazione.</li><li>Verifica della conservazione, conforme a quanto disposto all'articolo 72, lettera g) Reg. 1303/2013, di tutti i documenti relativi alle spese e agli audit necessari per garantire una pista di controllo adeguata.</li><li>Predisposizione ed utilizzo di procedure, istruzioni operative e strumenti idonei ad istituire misure antifrode efficaci e proporzionate, tenendo conto dei rischi individuati.</li><li>Collaborazione alla preparazione della dichiarazione di affidabilità di gestione e della sintesi annuale di cui all'articolo 59, paragrafo 5, lettere a) e b), del regolamento finanziario.</li><li>Partecipazione, in qualità di componente effettivo, al Tavolo Interfondo.</li></ol><p><em>In relazione alle azioni ascrivibili a procedure di appalto e ad altri macroprocessi diversi dagli aiuti, supporto all’Autorità di Gestione (AdG) del POR FESR FSE Molise 2014-2020 e del Patto per lo Sviluppo della Regione Molise FSC 2014-2020 per:</em></p><ol start=\"12\"><li>Verifica dell’effettiva fornitura dei prodotti e servizi cofinanziati; pagamento, da parte dei beneficiari, delle spese dichiarate, conformi al diritto applicabile, al programma operativo e alle condizioni per il sostegno dell'operazione; tali verifiche comprendono: verifiche amministrative rispetto a ciascuna domanda di rimborso presentata dai beneficiari; verifiche sul posto delle operazioni. Le verifiche sul posto di singole operazioni possono essere svolte a campione.</li><li>Verifica del mantenimento, a cura dei beneficiari, di un sistema di contabilità separata o di una codificazione contabile adeguata a tutte le transazioni relative a un'operazione.</li><li>Verifica della conservazione, conforme a quanto disposto all'articolo 72, lettera g) Reg. 1303/2013, di tutti i documenti relativi alle spese e agli audit necessari per garantire una pista di controllo adeguata.</li><li>Predisposizione e utilizzo di procedure, istruzioni operative e strumenti idonei ad istituire misure antifrode efficaci e proporzionate, tenendo conto dei rischi individuati.</li><li>Collaborazione alla preparazione della dichiarazione di affidabilità di gestione e della sintesi annuale di cui all'articolo 59, paragrafo 5, lettere a) e b), del regolamento finanziario.</li><li>Rendicontatore intermedio con funzione di vigilare sulla regolarità delle procedure e delle spese e di adottare le iniziative necessarie a prevenire e correggere le irregolarità e gli indebiti utilizzi delle risorse assegnate alla Regione Molise nell’ambito del PNRR Missione 2, Componente 4, Sub-Investimento 2.1B.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"DG.01":{"rif":"DG.1","titolo":"SERVIZIO DI SUPPORTO AL DIRETTORE GENERALE","n":14,"html":"<ol><li>Supporto al Direttore generale nell’esercizio delle funzioni proprie così come rubricate all’art. 15 bis della L.R. 23-10-2010 n. 10 ss.mm.ii.</li><li>Supporto al Direttore generale nella partecipazione a gruppi di lavoro, tavoli tecnici e riunioni istituzionali.</li><li>Coordinamento delle attività dei Servizi della Direzione, assicurando il costante flusso informativo e documentale tra la Direzione e i Servizi della stessa.</li><li>Raccordo della Direzione generale con le altre Strutture regionali.</li><li>Coordinamento delle attività per l’adozione del Piano di comunicazione istituzionale.</li><li>Coordinamento e gestione del Protocollo unico regionale.</li><li>Coordinamento e controllo delle attività in materia di semplificazione amministrativa e sviluppo della capacità amministrativa dell’ente regionale.</li><li>Coordinamento delle attività per la redazione del Documento di Economia e Finanza regionale e del documento di performance organizzativa dell’Amministrazione regionale.</li><li>Coordinamento dei controlli interni.</li><li>Attuazione degli indirizzi in materia di controllo di controllo strategico – Individuazione indicatori – Reportistica.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li><li>Coordinamento sistema statistico regionale</li><li>Funzioni previste dal Piano statistico nazionale.</li><li>Attività statistica degli organi del Sistema Statistico Regionale (SISTAR).</li></ol>"},"DG.02":{"rif":"DG.2","titolo":"SERVIZIO RISORSE UMANE E ORGANIZZAZIONE DEL LAVORO","n":31,"html":"<ol><li>Costituzione, gestione ed estinzione del rapporto di impiego del personale di ruolo e non di ruolo in relazione a tutti gli istituti contrattuali, anche di carattere economico, ed esercizio della funzione di sostituto d’imposta.</li><li>Acquisizione e utilizzazione delle risorse umane.</li><li>Gestione della dotazione organica regionale.</li><li>Gestione della formazione del personale regionale, dei tirocini formativi e di orientamento presso le strutture regionali.</li><li>Conferimento e revoca degli incarichi dirigenziali.</li><li>Autorizzazione allo svolgimento di incarichi extraistituzionali e anagrafe delle prestazioni.</li><li>Procedure amministrative e contabili per la costituzione e/o per la modificazione delle segreterie particolari dei componenti della Giunta regionale.</li><li>Ufficio per i Procedimenti Disciplinari (UPD).</li><li>Istruttoria giuridico-legale e gestione della funzione di rappresentanza, patrocinio e assistenza in giudizio e nelle fasi stragiudiziali dell’Amministrazione regionale nei giudizi aventi per oggetto il rapporto di lavoro dei propri dipendenti.</li><li>Predisposizione di pareri giuridici nonché di transazioni giudiziali e stragiudiziali e definizione di controversie in materia giuslavoristica.</li><li>Monitoraggio e certificazione della spesa del personale e compilazione del conto annuale.</li><li>Gestione del servizio sostitutivo di mensa regionale con esclusione dell’attività di individuazione del fornitore.</li><li>Gestione attività istruttorie propedeutiche all’attivazione di forme di lavoro autonomo.</li><li>Gestione dei contratti di lavoro autonomo ai sensi dell’art. 7, commi 6 e ss, del D.Lgs. n. 165/2001 e relativi adempimenti amministrativi e contabili.</li><li>Definizione dei fabbisogni, pianificazione delle assunzioni e predisposizione delle politiche occupazionali e degli enti del Sistema regione.</li><li>Gestione delle relazioni sindacali.</li><li>Elaborazione e gestione dei sistemi di valutazione e di incentivazione delle performance lavorative.</li><li>Supporto tecnico e organizzativo e coordinamento delle attività del Nucleo di Valutazione per l’attività e le prestazioni dei dirigenti.</li><li>Definizione di piani e procedure di ottimizzazione e miglioramento delle attività dei Servizi.</li><li>Attività di consulenza, analisi e sviluppo organizzativo delle strutture regionali.</li><li>Organizzazione e razionalizzazione delle strutture e sviluppo del modello organizzativo.</li><li>Programmazione e coordinamento degli interventi di sviluppo organizzativo e impatto potenziale delle cessazioni del rapporto di lavoro.</li><li>Analisi organizzativa, dei flussi di lavoro e reingegnerizzazione dei processi di lavoro.</li><li>Coordinamento dei processi di sviluppo, formazione e valutazione delle risorse umane.</li><li>Analisi e monitoraggio delle azioni e delle politiche del personale.</li><li>Definizione dei progetti di miglioramento basati su standard di lavoro, valorizzazione delle risorse, semplificazione e miglioramento.</li><li>Piani e programmi di formazione per il personale regionale.</li><li>Definizione di piani e procedure di ottimizzazione e miglioramento delle attività dei Servizi.</li><li>Sistema professionale e delle competenze, piani di sviluppo organizzativo e del personale, politiche retributive.</li><li>Coordinamento e controllo sugli atti fondamentali in materia di organizzazione, funzionamento e personale degli Enti del Sistema regionale.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"DG.03":{"rif":"D.G.3","titolo":"SERVIZIO SEGRETERIA DELLA GIUNTA REGIONALE","n":4,"html":"<ol><li>Controllo di regolarità formale degli atti proposti alla Giunta regionale, coordinamento con i Servizi regionali per l’armonizzazione delle proposte e l’ottimizzazione del processo di formazione dell’atto, assistenza al Presidente e agli Assessori durante le sedute di Giunta.</li><li>Gestione dell’archivio corrente delle deliberazioni della Giunta regionale con rilascio delle copie all’utenza interna ed esterna.</li><li>Attività istruttoria propedeutica alla promulgazione di leggi e all’emanazione di regolamenti regionali.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A1.01":{"rif":"I.1","titolo":"SERVIZIO COMPETITIVITÀ DEI SISTEMI PRODUTTIVI, SVILUPPO DELLE ATTIVITA’INDUSTRIALI, COMMERCIALI E ARTIGIANALI - COOPERAZIONE TERRITORIALE EUROPEA - POLITICHE DELLA CONCORRENZA, INTERNAZIONALIZZAZIONE DELLE IMPRESE E MARKETING ECONOMICO E INDUSTRIALE","n":46,"html":"<ol><li>Attuazione e monitoraggio interventi FSC APQ “Sviluppo imprenditoria locale”.</li><li>Attuazione e monitoraggio interventi PAR FSC Molise 2007-2013.</li><li>Supporto operativo alle attività di gestione delle politiche di sviluppo.</li><li>Programmazione e gestione degli interventi di sostegno alle imprese industriali, artigiane e commerciali e ai comuni per l’implementazione dei luoghi del commercio e rapporti con le amministrazioni comunali.</li><li>Programmazione e gestione degli interventi di sostegno per la competitività dei sistemi produttivi.</li><li>Interventi regionali, statali e comunitari relativi alle competenze del Servizio.</li><li>Attività di attuazione dell’area di crisi complessa plurisettoriale, ai sensi delle disposizioni nazionali in materia.</li><li>Applicazione dell’offerta localizzativa costituita dall’insieme delle opportunità che possono concorrere alla crescita e allo sviluppo dell’area in cui insiste la crisi.</li><li>Interventi di sostegno alle attività imprenditoriali mediante l’individuazione e l’attivazione di strumenti di incentivazione alle imprese, specificatamente vocati all’area di crisi.</li><li>Monitoraggio e valutazione finanziaria degli interventi.</li><li>Analisi, ricerche e studio delle problematiche relative al settore industriale.</li><li>Programmi di ricerca.</li><li>Iniziative di divulgazione e comunicazione delle attività svolte.</li><li>Semplificazione amministrativa per le imprese.</li><li>Adempimenti inerenti alla tenuta del Registro del “de minimis” e banca dati degli aiuti regionali alle imprese.</li><li>Supporto all’innovazione dei processi produttivi e alle attività di ricerca nelle imprese.</li><li>Sostegno alla creazione di poli e di reti fra le imprese.</li><li>Sviluppo dei parchi scientifici e tecnologici regionali e raccordo tra gli stessi e il sistema produttivo.</li><li>Coordinamento degli strumenti della programmazione negoziata e per i contratti di sviluppo.</li><li>Coordinamento e gestione amministrativa, tecnica e finanziaria delle politiche di incentivazione delle PMI e degli insediamenti produttivi.</li><li>Attuazione e gestione degli interventi regionali, statali e comunitari a favore delle PMI.</li><li>Studi di settore.</li><li>Interventi per l’internazionalizzazione del sistema economico e produttivo regionale.</li><li>Localizzazione e realizzazione degli insediamenti turistico-ricettivi; potenziamento e ammodernamento delle strutture esistenti.</li><li>Incentivazione delle attività produttive, turistiche e ricreative compatibili.</li><li>Attrazione degli investimenti.</li><li>Rapporti con la Cabina di Regia Nazionale, l’ICE, Il Sistema Camerale e i Ministeri Competenti per i progetti di internazionalizzazione.</li><li>Sportello regionale per l’internazionalizzazione e Portale internazionalizzazione regionale.</li><li>Coordinamento e sviluppo della Cooperazione Territoriale Europea (internazionale, transnazionale, transfrontaliera e interregionale).</li><li>Assistenza a livello tecnico-operativo e di segreteria al Comitato tecnico consultivo per la cooperazione allo sviluppo.</li><li>Promozione e sviluppo della cooperazione internazionale e transnazionale.</li><li>Attività di relazioni pubbliche nei confronti delle Istituzioni dell’UE, anche nell’ambito di reti europee cui la Regione partecipa, a sostegno delle posizioni e degli interessi della Regione.</li><li>Coordinamento delle attività dell'Ufficio di Bruxelles, anche per le relazioni con le istituzioni e gli organismi dell'Unione Europea, con il Comitato delle Regioni, con la Rappresentanza dell'Italia e le realtà regionali italiane ed europee presenti a Bruxelles.</li><li>Marketing economico e industriale e sostegno all’internazionalizzazione.</li><li>Progetti strategici di rete e cluster.</li><li>Interventi di sostegno ai programmi di ricerca e di trasferimento tecnologico.</li><li>Politiche europee della concorrenza, aiuti di stato e procedure d’infrazione e coordinamento con l’Avvocatura regionale per pareri legislativi in merito.</li><li>Programmazione insediamenti grande distribuzione.</li><li>Gestione delle attività amministrative e tecniche connesse all’erogazione di contributi all’accesso al credito.</li><li>Segreteria dell’Osservatorio regionale del commercio e rapporti con gli organi di tutela e rappresentanti dell’artigianato.</li><li>Carburanti: programmazione, monitoraggio, gestione Banca Dati.</li><li>Controllo e predisposizione nomine consigli camerali.</li><li>Interventi per lo sviluppo, la valorizzazione e la tutela dell’artigianato artistico e tradizionale.</li><li>Programmazione annuale fiere e mercati e tutela dei consumatori.</li><li>Promozione e sviluppo della editoria.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A1.02":{"rif":"I.1","titolo":"SERVIZIO TUTELA E VALUTAZIONI AMBIENTALI - FITOSANITARIO REGIONALE","n":39,"html":"<ol><li>Attività di ricerca, studio e aggiornamento con riferimento alla vigente normativa nazionale e comunitaria in materia di valutazione ambientale strategica, valutazione di impatto ambientale e autorizzazione integrata ambientale, nonché di Impatto sociale in collegamento con le competenti strutture.</li><li>Procedimenti di Valutazione Impatto Ambientale (VIA) e di Valutazione Ambientale Strategica (VAS) previsti dal D.Lgs n° 152/06 e ss.mm e dalla L.R. n° 21/00.</li><li>Svolgimento, ai sensi del D.Lgs. 152/06 ss.mm.ii, del ruolo di Autorità Competente in materia di Valutazione Ambientale Strategica (VAS) e di Valutazione di Impatto Ambientale (VIA) Autorizzazione Integrata Ambientale (AIA).</li><li>Conduzione dei processi di Valutazione Ambientale Strategica, organizzazione e gestione delle fasi di screening, scoping, partecipazione e consultazione, espressione dei pareri motivati di competenza avvalendosi dell'ARPA.</li><li>Conduzione dei processi di Autorizzazione Integrata Ambientale, organizzazione e gestione delle varie fasi, espressione dei pareri di competenza avvalendosi dell'ARPA.</li><li>Procedure di verifica e di valutazione di impatto ambientale organizzazione delle relative verifiche preliminari ed istruttorie, espressione dei provvedimenti di Screening e Valutazione di Impatto Ambientale di competenza avvalendosi anche dell'ARPA.</li><li>Attività di coordinamento e organizzazione delle fasi di emissione dei pareri delle strutture regionali e degli enti locali competenti che partecipano ai processi e ai procedimenti di Valutazione ambientale con particolare riferimento alle procedure VincA (Valutazione di Incidenza Ambientale) ed AIA rientranti nel procedimento di VIA.</li><li>Attività di interscambio e rapporti in materia di VIA, VAS ed AIA con i competenti uffici delle altre regioni italiane ed europee, con il Ministero dell’Ambiente e della Tutela del Territorio e del mare e con la competente unità VIAVAS della DG Ambiente della Commissione Europea.</li><li>Gestione del sito web dedicato, deposito dei progetti, consultazioni al pubblico ed accesso agli atti.</li><li>Predisposizione e aggiornamento del Piano regionale di gestione dei rifiuti (PRGR) e attività di indirizzo, coordinamento e controllo dei processi di attuazione.</li><li>Definizione di indirizzi e criteri generali per il rilascio delle autorizzazioni, dei controlli e del monitoraggio per l’esercizio di impianti di smaltimento e recupero rifiuti di cui al D. Lgs. n. 152/2006 e ss. mm. e ii.</li><li>Elaborazione di studi, normative, piani e programmi di risanamento, tutela della qualità dell’aria, di disinquinamento acustico, elettromagnetico e luminoso e delle relative infrastrutture.</li><li>Indirizzo e coordinamento in materia di pericoli di incidente rilevante connessi con la presenza di determinate sostanze pericolose.</li><li>Attività di indirizzo e vigilanza sui programmi e attività di competenza attribuite all'ARPA.</li><li>Redazione e aggiornamento del Piano regionale di Tutela delle Acque ed attuazione delle misure previste per il raggiungimento degli obiettivi fissati per la salvaguardia qualitativa e quantitativa delle risorse idriche.</li><li>Rilevamento delle caratteristiche qualitative e quantitative dei corpi idrici superficiali e sotterranei e dello stato degli ecosistemi acquatici, designazione e classificazione delle acque in funzione degli obiettivi di qualità.</li><li>Pianificazione relativa alla salvaguardia, tutela ed utilizzazione intersettoriale ed interregionale delle risorse idriche, ivi comprese le attività per la definizione del bilancio idrico e del deflusso minimo vitale.</li><li>Monitoraggio e controllo delle acque superficiali e sotterranee.</li><li>Tutela delle acque dall'inquinamento e regolamentazione degli scarichi di acque reflue.</li><li>Attività di indirizzo per la bonifica dei siti e aree inquinate per lo svolgimento dei compiti e funzioni connessi all'attuazione delle misure di risanamento e protezione delle acque sotterranee e superficiali con la bonifica e messa in sicurezza dei siti inquinati.</li><li>Procedimenti autorizzativi in materia di emissioni in atmosfera.</li><li>Rilascio di pareri in materia di emissioni in atmosfera, di ordinanza nell’ambito dei procedimenti autorizzativi A.U.A, A.I.A., procedimento unico ex L. 387/2003.</li><li>Comunicazioni/autorizzazioni delle attività in deroga ai sensi dell'articolo 272, commi 1 e 2, del D.Lgs. 152/06.</li><li>Procedimenti attinenti alle funzioni di controllo amministrativo.</li><li>Coordinamento implementazione attività Provvedimento Autorizzativo Unico Regionale (PAUR).</li><li>Attuazione e monitoraggio interventi FSC APQ “Ambiente”.</li><li>Attuazione e monitoraggio interventi PAR e Obiettivi di Servizio FSC Molise 2007-2013.</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise ratione materiae.</li><li>Programmazione e gestione attività di prevenzione delle malattie delle piante; attività fitopatologica.</li><li>Programmazione e vigilanza sulle aree protette della Regione.</li><li>Programmazione, progettazione di interventi di valorizzazione delle aree protette regionali.</li><li>Gestione adempimenti tecnico-amministrativi per la tutela della rete Natura 2000 compresi gli adempimenti relativi alla Valutazione di Incidenza di piani e progetti.</li><li>Coordinamento, indirizzo e controllo della disciplina di uso del territorio per la conservazione e/o il ripristino degli habitat e delle specie.</li><li>Pianificazione della rete ecologica regionale e progettazione interventi per la riduzione degli effetti della frammentazione e del conseguente isolamento degli ambienti naturali e seminaturali sulle popolazioni.</li><li>Strategia regionale dello sviluppo sostenibile.</li><li>Promozione e gestione di programmi di informazione e di educazione ambientale in raccordo con le altre strutture regionali interessate, con le autorità scolastiche e con gli altri soggetti che operano nel campo dell’educazione ambientale.</li><li>Attività di coordinamento e sviluppo delle reti tra organismi pubblici e privati che operano nel settore dell’informazione ed educazione ambientale.</li><li>Programmazione strategica in materia di adattamento ai cambiamenti climatici e sostenibilità.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A1.03":{"rif":"I.2","titolo":"SERVIZIO PROGRAMMAZIONE POLITICHE ENERGETICHE","n":22,"html":"<ol><li>Programmazione e gestione di interventi in materia di risparmio e uso razionale dell’energia.</li><li>Gestione dei bandi relativi a Programmi Regionali, Nazionali e/o Comunitari (POR, FSC, FESR, ecc…).</li><li>Incentivazione all’utilizzo di fonti rinnovabili.</li><li>Procedure di autorizzazione per impianti di produzione di energia elettrica da fonte convenzionale.</li><li>Autorizzazioni alla costruzione e all’esercizio di impianti di produzione di energia elettrica mediante l’utilizzo di fonti rinnovabili.</li><li>Redazione memorie difensive e gestione pratiche contenzioso pregresso.</li><li>Gestione della partecipazione a progetti internazionali.</li><li>Autorizzazione alla costruzione di elettrodotti.</li><li>Metanodotti regionali e interregionali ad alta pressione (solo intesa).</li><li>Programma regionale di metanizzazione.</li><li>Autorizzazione per lo stoccaggio di idrocarburi e per l’esercizio distribuzione e vendita di GPL.</li><li>Incentivi alle imprese titolari di permessi di ricerca e prospezione di idrocarburi (solo intesa).</li><li>Autorizzazione impianti di stoccaggio di oli minerali e relativo collaudo.</li><li>Gestione degli attestati di prestazione energetica.</li><li>Gestione, monitoraggio e aggiornamento del Piano Energetico Ambientale Regionale (PEAR).</li><li>Implementazione e gestione sito web per il tematismo “Energia”.</li><li>Redazione Piani attuativi del PEAR.</li><li>Gestione del servizio di ispezione degli impianti termici per il controllo e l’accertamento dello stato di manutenzione e di esercizio.</li><li>Gestione dei rapporti con il soggetto concessionario.</li><li>Procedure sanzionatorie a seguito di accertamento delle irregolarità.</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise ratione materiae.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A1.04":{"rif":"I.4","titolo":"SERVIZIO DI PROTEZIONE CIVILE","n":34,"html":"<ol><li>Coordinamento delle attività di protezione civile di competenza regionale e cura dei relativi rapporti con i soggetti ed organismi istituzionali interessati.</li><li>Attuazione delle normative comunitarie, statali e regionali in materia di protezione civile.</li><li>Attuazione e monitoraggio interventi FSC PRA Molise ex Delibera CIPE n. 62/2011.</li><li>Gestione della Sala Operativa Regionale di Protezione Civile con coordinamento degli interventi di emergenza e soccorso in ambito regionale, nazionale e internazionale.</li><li>Elaborazione e predisposizione dei modelli organizzativi per la gestione del soccorso in situazioni di emergenza.</li><li>Gestione e attivazione, in caso di emergenza, della Colonna Mobile Regionale di Protezione Civile.</li><li>Supporto alle decisioni delle Autorità locali di Protezione Civile nelle fasi di allerta e di gestione dell’emergenza.</li><li>Predisposizione dei sistemi di connessione operativa con i livelli sovra e sub regionali di protezione civile.</li><li>Promozione e sviluppo della cooperazione istituzionale transfrontaliera in materia di protezione civile con le Regioni e le Nazioni cooperanti al Molise.</li><li>Gestione della connessione tra i Centri di Protezione Civile presenti nelle diverse Regioni contermini al Molise e con il Dipartimento Nazionale della Protezione Civile.</li><li>Monitoraggio dei rischi naturali.</li><li>Pianificazione e programmazione delle attività di lotta attiva agli antincendi boschivi, anche in coordinamento con le strutture regionali, il Corpo forestale dello Stato ed il Corpo nazionale dei Vigili del fuoco.</li><li>Gestione e coordinamento della Sala Operativa Unificata Permanente nell’ambito delle attività di lotta attiva agli incendi boschivi.</li><li>Monitoraggio e verifica dell’aggiornamento del Catasto delle Aree Percorse dal Fuoco da parte dei Comuni.</li><li>Gestione del servizio aereo regionale costituito da velivoli ad ala fissa ed ala rotante e dalla relativa elisuperficie di protezione civile e dal campo di volo.</li><li>Potenziamento della piattaforma modellistica idraulica e meteorologica ai fini di protezione civile.</li><li>Attivazione dei presidi territoriali idraulici per la gestione del rischio idraulico ed idrogeologico.</li><li>Valutazione dei livelli di criticità idraulica ed idrogeologica regionale e gestione dei sistemi di allertamento di cui alla Direttiva del P.C.M. del 27.02.2004 e ss.mm.ii..</li><li>Aggiornamento e sviluppo evolutivo del sistema di allertamento regionale per il rischio idraulico ed idrogeologico, con l’emissione dei relativi avvisi e delle allerte ai fini di protezione civile.</li><li>Monitoraggio meteoidropluviometrico ai fini di protezione civile, con predisposizione di piani e programmi di upgrade delle reti regionali di monitoraggio meteoidraulico.</li><li>Rilievo dei parametri fisici propedeutici alla conoscenza dei fenomeni naturali ed alla mitigazione dei rischi.</li><li>Pianificazione regionale annuale e pluriennale di Protezione Civile, concernente i rischi naturali ed antropici.</li><li>Attività di indirizzo e coordinamento per la redazione di piani locali, comunali e/o intercomunali di protezione civile.</li><li>Attività di programmazione, previsione e di prevenzione dei rischi.</li><li>Attività di competenza regionale in materia di rischio di incidente rilevante ai sensi del D.lgs. 334/ 1999, con particolare riguardo all'attività di vigilanza, controllo, pianificazione e di azione al fine di ridurre gli effetti dell'incidente rilevante sull'ambiente e sulla salute pubblica.</li><li>Gestione dei sistemi telematici e informatici, banche dati territoriali ed informatiche e reti radio di protezione civile.</li><li>Istruttoria e supporto tecnico all’attivazione delle procedure concernenti la richiesta regionale dello stato d’emergenza.</li><li>Attività finalizzata all’analisi della Condizione Limite per Emergenza (CLE).</li><li>Gestione tecnico amministrativa post emergenziale e post commissariale a seguito di eventi calamitosi.</li><li>Gestione ed adempimenti connessi all’Albo regionale di volontariato della Protezione Civile.</li><li>Attività di formazione, anche interna, informazione ed aggiornamento professionale in materia di protezione civile.</li><li>Attività di comunicazione nei confronti della popolazione sui temi della protezione civile.</li><li>Attività autorizzative e realizzative connesse alle reti, infrastrutture, servizio, logistica di protezione civile.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A1.06":{"rif":"I.5","titolo":"SERVIZIO PER LA GESTIONE DELLE EMERGENZE REGIONALI 112","n":15,"html":"<ol><li>Programmazione e implementazione del Sistema NUE 112, in ossequio alla normativa europea e nazionale, attraverso l’attivazione, il coordinamento e la gestione delle C.U.R. – Centrali Uniche di Risposta del Numero Unico Europeo dell’Emergenza Regionale - 112 NUE – (CUR).</li><li>Coordinamento e gestione delle attività in ambito regionale, garantendo la pronta risposta e la corretta gestione delle richieste di intervento urgente da parte dell’utenza.</li><li>Coordinamento dei rapporti tra la CUR NUE 112 e le Sale Operative di secondo livello definite PSAP2, attraverso la definizione e la periodica revisione delle procedure e dei protocolli operativi, garantendo la pronta risposta e corretta gestione delle richieste di intervento urgente da parte dell’utenza.</li><li>Partecipazione ai Tavoli Istituzionali in tema di Sistema NUE 112 e soccorso pubblico.</li><li>Cura degli aspetti logistici e di approvvigionamento, acquisti economali di beni e servizi necessari alla piena e continuativa operatività del servizio 112 NUE in autonomia o anche avvalendosi del sostegno della CUR regionale.</li><li>Coordinamento delle attività di tutti gli Organi coinvolti nell’ambito delle attività di prevenzione e gestione delle situazioni emergenziali che interessano il territorio regionale.</li><li>Rapporti con i Responsabili del Ministero dell’Interno, della Prefettura, della Polizia di Stato, dell’Arma dei Carabinieri, del Corpo Nazionale dei Vigili del Fuoco, ASREM e di altre Amministrazioni.</li><li>Stipula dei Protocolli di Intesa e degli Accordi Operativi necessari alla corretta gestione delle attività interdisciplinari in tema di soccorso pubblico.</li><li>Monitoraggio e studio dei dati di attività delle CUR NUE 112 e dei PSAP2 e studio dei flussi e della tipologia delle richieste di assistenza allo scopo di effettuare una corretta analisi del rischio e di elaborare efficaci modelli di intervento.</li><li>Studio e sperimentazione di soluzioni tecnologiche innovative atte a rendere sempre maggiormente efficace la risposta alle diverse situazioni emergenziali.</li><li>Predisposizione dei percorsi di formazione rivolti agli operatori afferenti al NUE 112 e partecipazione, anche in collaborazione con altri Enti/Amministrazioni o Istituti Universitari e di Alta formazione, ad attività di formazione del personale anche afferente ad altre amministrazioni, società e organizzazioni di promozione sociale operanti nel settore dell’emergenza, della protezione civile e del soccorso pubblico allo scopo di promuovere la crescita delle competenze tecniche e della cultura dell’emergenza.</li><li>Progettazione e gestione di campagne di informazione e comunicazione integrate o momenti formativi utili alla corretta conoscenza e diffusione dei servizi e delle attività del Sistema NUE 112 regionale.</li><li>Collaborazione con le Società Scientifiche del settore per promuovere lo sviluppo della cultura dell’emergenza.</li><li>Gestione delle richieste di accesso agli atti provenienti dalla magistratura ordinaria, dalle forze dell’ordine, dagli studi legali e privati cittadini.</li><li>Gestione delle richieste di materiale o elementi probatori inerenti episodi che configurano reato, oggetto di indagini da parte degli organi inquirenti che rivestono carattere di estrema urgenza, quando necessarie ad identificare persone coinvolte o comunque informate dei fatti e che devono pertanto essere sentite con urgenza dall’Autorità Giudiziaria.</li></ol>"},"A1.05":{"rif":"I.6","titolo":"SERVIZIO PARTECIPAZIONI REGIONALI","n":9,"html":"<ol><li>Atti di indirizzo strategico sui flussi finanziari regionali indirizzati agli organismi partecipati e gestione dei rapporti con le Società in house providing - Controllo analogo.</li><li>Coordinamento e gestione degli adempimenti e degli interventi correlati all’esercizio dei diritti scaturenti dalle partecipazioni societarie.</li><li>Mappatura degli organismi partecipati, anagrafe degli organi gestionali e di vigilanza e dei rispettivi livelli retributivi, monitoraggio, valutazione finanziaria degli interventi e verifica dei risultati gestionali conseguiti.</li><li>Monitoraggio delle società a partecipazione regionale.</li><li>Controllo tecnico-contabile sui fondamentali atti contabili (bilancio, variazioni, assestamenti, rendiconto) delle società partecipate e delle società in house providing.</li><li>Rapporti con la Corte dei conti e con gli Organi governativi in materia di società partecipate.</li><li>Controllo e monitoraggio contabile-finanziario delle società partecipate, nonché raccordo tra i documenti contabili delle società e degli enti con quelli del bilancio regionale.</li><li>Istruttoria dei procedimenti di nomina di competenza del Presidente e della Giunta regionale relativi agli organismi partecipati, con esclusione di quelli pertinenti all’organizzazione sanitaria.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A2.01":{"rif":"II.1","titolo":"TUTELA E VALORIZZAZIONE DELLA MONTAGNA E DELLE FORESTE, BIODIVERSITA’ AGRICOLA E GESTIONE FITO-SANITARIA","n":28,"html":"<ol><li>Nucleo di vigilanza e controllo delle produzioni biologiche e altre certificate.</li><li>Attività di controllo Organismi Geneticamente Modificati.</li><li>Attività in materia di bonifica integrale e irrigazione.</li><li>Adempimenti connessi alla gestione e al controllo amministrativo delle attività dei consorzi di bonifica.</li><li>Vitivinicoltura, olivicoltura, cerealicoltura, foraggicoltura, orticoltura e bieticolo-saccarifero.</li><li>Piani irrigui e relative infrastrutture.</li><li>Gestione risorse per l’attuazione delle politiche per la montagna e tutela e valorizzazione del territorio montano e svantaggiato.</li><li>Gestione delle attività di vivaistica regionale e per la produzione di piante micorrizate.</li><li>Catalogazione, conservazione e valorizzazione della rete sentieristica regionale.</li><li>Programmazione, coordinamento, indirizzo, gestione e controllo delle attività di forestazione.</li><li>Gestione e attuazione dei programmi di valorizzazione della tartuficoltura.</li><li>Iniziative di informazione in materia micologica e finanziamento di corsi di formazione.</li><li>Coordinamento delle attività degli Enti delegati in materia di raccolta e coltivazione dei tartufi e dei funghi.</li><li>Gestione e modalità di approvvigionamento del materiale di propagazione di base, controllo della commercializzazione e della qualità del materiale forestale di moltiplicazione.</li><li>Organizzazione dei lavori della Commissione tecnica forestale e certificazioni relative alle ditte boschive.</li><li>Gestione tecnico-amministrativa in materia di vincolo idrogeologico, prescrizioni di massima e di Polizia forestale regionale.</li><li>Pianificazione forestale.</li><li>Tutela e valorizzazione degli alberi monumentali.</li><li>Applicazione delle direttive comunitarie e della normativa nazionale per la conservazione della biodiversità.</li><li>Programmazione e progettazione in materia di tutela della biodiversità.</li><li>Gestione tecnica dei suoli tratturali e delle terre civiche e istruttoria tecnica finalizzata alle concessioni di suoli tratturali, in raccordo con il Servizio Logistica.</li><li>Architettura rurale e del paesaggio agricolo-forestale, programmi e misure per la valorizzazione e conservazione dell’ambiente montano.</li><li>Raccordo con Sportello Unico Regionale allocato presso la Direzione generale.</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise ratione materiae.</li><li>Vigilanza sui controlli delle produzioni certificate e delle colture agricole di importazione ed esportazione.</li><li>Autorizzazione alla commercializzazione di piante e semi e vigilanza e controllo delle aziende vivaistiche.</li><li>Certificazione fitosanitaria e rilascio dell’autorizzazione dell’uso del passaporto dei vegetali e dei loro derivati.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A2.02":{"rif":"II.2","titolo":"SERVIZIO COORDINAMENTO E GESTIONE DELLE POLITICHE EUROPEE PER AGRICOLTURA, ACQUACOLTURA E PESCA – ATTIVITA’ VENATORIA","n":33,"html":"<ol><li>Gestione della comunicazione istituzionale del programma Piano di Sviluppo Rurale - PSR e coordinamento attività assistenza tecnica e monitoraggio.</li><li>Organizzazione e funzionamento del Sistema Informativo, della Valutazione e del monitoraggio del Piano di Sviluppo Rurale.</li><li>Coordinamento delle attività inerenti alle irregolarità e le procedure di contenzioso e di recupero.</li><li>Coordinamento e attuazione Programmi di interesse comunitario (L.E.A.D.E.R.).</li><li>Programmazione in materia di acquacoltura e pesca produttiva e relative politiche di salvaguardia e di potenziamento, incentivi e contributi alle imprese esercenti l’attività della pesca, predisposizione e sviluppo dei piani e programmi per l’utilizzo delle acque interne ai fini dell’attività di acquacoltura, gestione del Fondo Europeo per la Pesca (FEP).</li><li>Programmazione strategica e attuazione attività connesse alle bio-agrienergie.</li><li>Ricerca in agricoltura e rapporti istituzionali ad essa collegata (rete interregionale, Programma Life, Programma Europa nel Mediterraneo - Med, Accordi programma quadro - APQ).</li><li>Infrastrutture telematiche, a banda larga e ultra-larga. Elaborazione, approvazione ed aggiornamento del Piano faunistico venatorio e coordinamento dei relativi piani provinciali.</li><li>Valorizzazione e tutela della fauna terrestre e ittica e attività connesse all’esercizio del prelievo ittico e venatorio.</li><li>Procedimenti connessi alle attività e alle funzioni amministrative in materia di caccia, pesca, raccolta funghi e tartufi previste dalla L. n. 157/1992 e dalle LL.RR. n. 19/1993 n. 7/1998, n. 4/2008 e n. 24/2005.</li><li>Programmazione faunistico-venatoria, pianificazione e attuazione in materia di caccia e pesca nelle acque interne con annessi procedimenti VAS.</li><li>Rilascio autorizzazioni per l’esercizio venatorio e per la pesca nelle acque interne.</li><li>Autorizzazioni messa in secca di tratti fluviali.</li><li>Coordinamento attività di tabellazione dei corsi d’acqua.</li><li>Valorizzazione e tutela della fauna terrestre e ittica e attività connesse all’esercizio del prelievo ittico e venatorio.</li><li>Affidamento e gestione degli interventi di miglioramento ambientale a scopo faunistico.</li><li>Acquisto e ripopolamento di fauna selvatica e ittica.</li><li>Rilascio autorizzazioni per prelievo fauna ittica per scopi scientifici.</li><li>Stima risarcimento dei danni alle colture agricole provocati da fauna selvatica.</li><li>Procedure di ammissione agli Ambiti Territoriali di Caccia dei cacciatori residenti nella Regione Molise.</li><li>Concessioni, revoche e rinnovi Zone Addestramento Cani, quagliodromi.</li><li>Autorizzazioni gare cinofile nelle zone di ripopolamento e cattura e nelle aree destinate alla caccia programmata.</li><li>Autorizzazioni per lo svolgimento di gare di caccia e pesca sportiva.</li><li>Detenzione fauna selvatica: rilascio, rinnovo e revoca autorizzazioni e verifica registri.</li><li>Istituzione e controllo delle aziende faunistico – venatorie e agri-turistico-venatorie.</li><li>Definizione delle politiche a sostegno delle attività venatorie a scopo produttivo.</li><li>Applicazione delle sanzioni per le infrazioni alla legge sulla pesca nelle acque interne ed ingiunzioni.</li><li>Pratiche risarcimento danni provocati dalla fauna selvatica e di notevole interesse scientifico.</li><li>Procedimenti afferenti alla ricerca e la raccolta dei tartufi e dei funghi epigei (rilascio del tesserino d'idoneità, corsi di formazione ed esami finali, rilascio attestazioni di riconoscimento).</li><li>Rilascio attestazioni di riconoscimento delle tartufaie coltivate e controllate.</li><li>Attività di pianificazione rivolta all'individuazione delle aree geografiche di raccolta del tartufo.</li><li>Interventi rivolti alla salvaguardia e alla promozione del tartufo.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A2.03":{"rif":"II.3","titolo":"SERVIZIO ECONOMIA DEL TERRITORIO, ATTIVITA’ INTEGRATIVE, INFRASTRUTTURE RURALI E SERVIZI ALLE IMPRESE – SOSTEGNO AL REDDITO E CONDIZIONALITA’","n":34,"html":"<ol><li>Procedure e adempimenti relativi all’imprenditoria agricola.</li><li>Interventi mirati al sostegno al reddito delle imprese agricole – Politica Agricola comune (PAC).</li><li>Gestione interventi a favore dell’agricoltura biologica e integrata.</li><li>Credito agrario, Piccola Proprietà Contadina.</li><li>Sistemi di qualità e multifunzionalità.</li><li>Politiche per il ricambio generazionale, imprenditoria giovanile e prepensionamento in agricoltura.</li><li>Formazione in agricoltura.</li><li>Agriturismo e Fattorie didattiche.</li><li>Adempimenti relativi alla sicurezza sui luoghi di lavoro del comparto agricolo.</li><li>Divulgazione agricola e sistemi di consulenza aziendale.</li><li>Osservatorio Agenzia per le erogazioni in agricoltura (AGEA), rapporti con Sistema informativo nazionale (SIN) e gestione utenze Sistema informativo agricolo nazionale (SIAN).</li><li>Centri autorizzati di assistenza agricola.</li><li>Attuazione di iniziative comunitarie, nazionali e regionali in favore delle filiere agroalimentari.</li><li>Rete di Informazione Contabile Agricola (RICA).</li><li>Pianificazione degli interventi finalizzati alla valorizzazione del territorio rurale.</li><li>Attività in materia di assetto del territorio agricolo, infrastrutture rurali, elettriche, acquedotti e programmazione viabilità rurale.</li><li>Organizzazioni Comuni di Mercato.</li><li>Valorizzazione produzioni e gestione DOP, IGT e marchi regionali.</li><li>Sviluppo ed incremento di produzioni eco-compatibili.</li><li>Interventi a favore delle aziende operanti in zone svantaggiate e zone soggette a vincoli ambientali.</li><li>Gestione adempimenti relativi alla “condizionalità”.</li><li>Associazionismo ed organizzazioni di produttori.</li><li>Produzioni agricole e agro-industriali. Programmazione e attuazione politiche settoriali.</li><li>Produzioni zootecniche: attuazione programmi comunitari, nazionali e regionali in allevamenti tradizionali, minori e alternativi.</li><li>Attività gestione LGN, controlli funzionali e SATA, rapporti con ARA.</li><li>Gestione regime quote latte.</li><li>Delimitazione e gestione danni da eventi calamitosi, atmosferici eccezionali e causati da animali selvatici protetti.</li><li>Gestione e coordinamento Uffici Operativi Territoriali e sportelli informativi in agricoltura.</li><li>Gestione attività UMA: verifiche, concessioni, assegnazioni, autorizzazioni e rapporti con G.d.F., Motorizzazione Civile, Dogana e Associazioni di categoria.</li><li>Controversie agrarie, contratti agrari, tentativi di conciliazione ex Legge 203/82, indagini statistiche e censimenti.</li><li>Rapporti ARSARP: verifica e approvazione programma triennale e stralci annuali, conferimento incarico e gestione attività sul territorio.</li><li>Attuazione e monitoraggio interventi FSC APQ “Agricoltura”.</li><li>Responsabile di Azione del Patto per lo Sviluppo del Molise ratione materiae.</li><li>Istruttoria e adozione di ordinanze-ingiunzione relative ai crediti di pertinenza del proprio Servizio.</li></ol>"},"A2.07":{"rif":"II.4","titolo":"SERVIZIO POLITICHE CULTURALI, DI PROMOZIONE TURISTICA E SPORTIVA – RAPPORTI CON I MOLISANI NEL MONDO – MARKETING DEL TERRITORIO","n":40,"html":"<ol><li>Programmazione e progettazione di interventi per la conservazione, recupero, promozione e valorizzazione dei beni culturali in raccordo con le competenti strutture nazionali e regionali.</li><li>Predisposizione, in raccordo con le strutture regionali competenti, degli Accordi di Programma per i Beni culturali.</li><li>Gestione amministrativa, monitoraggio, controllo e valutazione interventi in materia di beni culturali. Sviluppo di politiche integrate per i centri storici anche con riferimento alla loro rivitalizzazione.</li><li>Sviluppo e valorizzazione sistema museale.</li><li>Valorizzazione patrimonio librario e archivistico regionale.</li><li>Tutela e valorizzazione del patrimonio cultu
