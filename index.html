(function(){

  // SHA-256 (WebCrypto) con ripiego per contesti non sicuri

    var s = "grs|" + (pwd||"");
    try{
      if(window.crypto && crypto.subtle){
        var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
        return Array.prototype.map.call(new Uint8Array(buf), function(b){return ("0"+b.toString(16)).slice(-2)}).join("");

    var h=0; for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}

  };

  }
  async function seedDefaults(st){

      st.users = [
        {id:"u_admin",nome:"Amministratore",email:"admin@regione.molise.it",ruolo:"admin",servizi:[],attivo:true,pwdHash:await window.hashPwd("Molise2026!"),createdAt:nowIso()},
        {id:"u_niv",nome:"Nucleo Indipendente di Valutazione",email:"niv@regione.molise.it",ruolo:"niv",servizi:[],attivo:true,pwdHash:await window.hashPwd("Niv2026!"),createdAt:nowIso()},
        {id:"u_demo",nome:"Direttore di prova",email:"direttore.demo@regione.molise.it",ruolo:"utente",servizi:["DG.01"],attivo:true,pwdHash:await window.hashPwd("Demo2026!"),createdAt:nowIso()}

    async upsert(coll, doc){

      var arr=DB.state[coll]||[]; var i=arr.findIndex(function(d){return d.id===doc.id});
      if(i>=0)arr[i]=doc; else arr.push(doc);
      DB.state[coll]=arr.slice(); this.persist(); DB.emit(); return doc;

  };

  /* ───────────────────────── FIREBASE ───────────────────────── */
  var FB = {
    app:null, auth:null, db:null, unsubs:[],
    loadScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){rej(new Error("Impossibile caricare "+src))};document.head.appendChild(s)})},
    async init(){

      try{ await this.db.enablePersistence({synchronizeTabs:true}) }catch(e){}
      DB.state.settings = defaultSettings();
      DB.ready = true; DB.emit();
    },
    col(name){ return this.db.collection({schede:"schede",valutazioni:"valutazioni",users:"utenti",servizi:"servizi",settings:"impostazioni"}[name]) },
    stopWatch(){ this.unsubs.forEach(function(u){try{u()}catch(e){}}); this.unsubs=[]; },
    watch(user){
      var self=this; this.stopWatch();
      var staff = user.ruolo==="admin"||user.ruolo==="niv";
      function sub(q, coll, transform){
        var u=q.onSnapshot(function(snap){
          var arr=[]; snap.forEach(function(d){arr.push(Object.assign({id:d.id},d.data()))});
          if(transform) transform(arr); else DB.state[coll]=arr;
          DB.lastSync=new Date(); DB.error=null; DB.emit();
        },function(err){ console.error(coll,err); DB.error=coll+": "+err.message; DB.emit(); });
        self.unsubs.push(u);

      sub(self.col("servizi"),"servizi");
      sub(self.col("settings"),"settings",function(arr){var g=arr.find(function(x){return x.id==="generali"}); DB.state.settings=Object.assign(defaultSettings(),g||{}); if(!g&&staff){self.col("settings").doc("generali").set(defaultSettings())}});
      if(staff){
        sub(self.col("schede"),"schede");
        sub(self.col("valutazioni"),"valutazioni");
        sub(self.col("users"),"users");
      } else {
        var codes=(user.servizi||[]).slice(0,30);
        if(codes.length) sub(self.col("schede").where("serviceCode","in",codes),"schede"); else DB.state.schede=[];
        DB.state.valutazioni=[]; DB.state.users=[user];

      // Se non esistono servizi (primo avvio) l'amministratore li carica

        self.col("servizi").limit(1).get().then(function(s){ if(s.empty){ self.replaceAll("servizi", window.defaultServizi()) } });
      }
    },
    clean(o){ return JSON.parse(JSON.stringify(o)) },
    async upsert(coll,doc){
      if(coll==="settings"){ await this.col("settings").doc("generali").set(this.clean(doc),{merge:true}); return doc }
      var d=this.clean(doc); if(!d.id) d.id=uid();
      await this.col(coll).doc(d.id).set(d,{merge:false}); return d;
    },
    async remove(coll,id){ await this.col(coll).doc(id).delete() },
    async replaceAll(coll,docs){
      var self=this, existing=await this.col(coll).get(); var batch=this.db.batch(); var n=0;
      var keep={}; docs.forEach(function(d){keep[d.id||d.code]=true});
      existing.forEach(function(d){ if(!keep[d.id]){batch.delete(d.ref); n++} });
      docs.forEach(function(d){ var c=self.clean(d); c.id=c.id||c.code||uid(); batch.set(self.col(coll).doc(c.id),c); n++; });
      if(n) await batch.commit();
    },
    async importAll(st){
      for(var k of ["servizi","users","schede","valutazioni"]) if(st[k]) await this.replaceAll(k, st[k]);
      if(st.settings) await this.upsert("settings", st.settings);

  };

  /* ───────────────────────── SHAREPOINT (REST) ───────────────────────── */
  var SP = {
    site:"", prefix:"GRS_", timer:null, idMap:{},
    lists(){var p=this.prefix;return {schede:p+"Schede",valutazioni:p+"Valutazioni",users:p+"Utenti",servizi:p+"Servizi",settings:p+"Impostazioni"}},
    api(p){return this.site+"/_api/web/"+p},
    async digest(){var r=await fetch(this.site+"/_api/contextinfo",{method:"POST",headers:{Accept:"application/json;odata=nometadata"},credentials:"same-origin"});var d=await r.json();return d.FormDigestValue},
    async get(p){var r=await fetch(this.api(p),{headers:{Accept:"application/json;odata=nometadata"},credentials:"same-origin"});if(!r.ok)throw new Error("GET "+p+" -> "+r.status);return r.json()},
    async send(method,p,body,dg){
      var h={Accept:"application/json;odata=nometadata","Content-Type":"application/json;odata=nometadata","X-RequestDigest":dg||await this.digest()};
      if(method==="MERGE"||method==="DELETE"){h["X-HTTP-Method"]=method;h["IF-MATCH"]="*";method="POST"}
      var r=await fetch(this.api(p),{method:method,headers:h,credentials:"same-origin",body:body?JSON.stringify(body):undefined});
      if(!r.ok){var t=await r.text();throw new Error(p+" -> "+r.status+" "+t.slice(0,200))}
      if(r.status===204)return null; try{return await r.json()}catch(e){return null}
    },
    async readAll(title,select){
      var out=[], url=this.api("lists/getbytitle('"+title+"')/items?$top=5000"+(select?"&$select="+select:""));
      while(url){var r=await fetch(url,{headers:{Accept:"application/json;odata=nometadata"},credentials:"same-origin"});if(!r.ok)throw new Error("Lista "+title+" non leggibile ("+r.status+")");var d=await r.json();out=out.concat(d.value||[]);url=d["odata.nextLink"]||null}
      return out;
    },
    SCHEMA:{Schede:[["GRSServizio","Text"],["GRSArea","Text"],["GRSStato","Text"],["GRSAggiornato","Text"],["GRSJson","Note"]],
            Valutazioni:[["GRSServizio","Text"],["GRSStato","Text"],["GRSTotale","Number"],["GRSFascia","Text"],["GRSJson","Note"]],

            Impostazioni:[["GRSJson","Note"]]},
    async initLists(log){
      log=log||function(){}; var dg=await this.digest(), L=this.lists(), self=this;
      for(var k in L){var title=L[k], short=title.replace(this.prefix,"");
        var exists=true; try{await this.get("lists/getbytitle('"+title+"')?$select=Id")}catch(e){exists=false}

        var have={}; (await this.get("lists/getbytitle('"+title+"')/fields?$select=InternalName&$top=500")).value.forEach(function(f){have[f.InternalName]=true});
        for(var f of (this.SCHEMA[short]||[])){ if(have[f[0]])continue; await this.send("POST","lists/getbytitle('"+title+"')/fields",{Title:f[0],FieldTypeKind:{Text:2,Note:3,Number:9}[f[1]]},dg); log("  colonna "+f[0]) }
      }

    parse(items,coll){var self=this;var out=[];items.forEach(function(it){self.idMap[coll+":"+it.Title]=it.Id;if(!it.GRSJson)return;try{out.push(JSON.parse(it.GRSJson))}catch(e){}});return out},
    async loadAll(){

    async init(){

    },

  var newScheda=async function(svc){var s=emptyScheda(svc,user);try{await DB.upsert("schede",s);openScheda(s,true)}catch(e){toast(e.message,"err")}};
  var openVal=function(svc){setCtx({svc:svc});setView("valform");window.scrollTo(0,0)};
  var body;
  if(!DB.ready) body=h(Empty,{title:"Caricamento della piattaforma...",text:DB.mode==="firebase"?"Connessione a Firebase in corso":""});
  else if(!user) body=h(Login,{onLogin:onLogin});
  else if(view==="scheda"&&ctx&&ctx.scheda){ var cur=(DB.state.schede||[]).find(function(x){return x.id===ctx.scheda.id})||ctx.scheda; body=h("div",null,h(SchedaForm,{key:cur.id+(ctx.editable?"e":"r"),scheda:cur,editable:ctx.editable&&(user.ruolo==="admin"||cur.stato==="bozza"||cur.stato==="da_integrare"),user:user,onBack:function(){go(user.ruolo==="utente"?"home":"schede")},onDone:function(){go(user.ruolo==="utente"?"home":"schede")}}),isStaff(user)?h("div",{style:{marginTop:20}},h(EvidPanel,{scheda:cur})):null) }
  else if(view==="valform"&&ctx&&ctx.svc) body=h(ValForm,{key:ctx.svc.code,svc:ctx.svc,user:user,onBack:function(){go("val")}});
  else if(user.ruolo==="utente") body=view==="guida"?h(Guida,{user:user}):h(UserHome,{user:user,onNew:newScheda,onOpen:openScheda});
  else if(view==="schede") body=h(SchedeList,{user:user,openScheda:openScheda,newScheda:newScheda});
  else if(view==="val") body=h(ValList,{openVal:openVal});
  else if(view==="grad") body=h(Graduazione,{});
  else if(view==="utenti"&&user.ruolo==="admin") body=h(Utenti,{user:user});
  else if(view==="servizi"&&user.ruolo==="admin") body=h(Servizi,{});
  else if(view==="imp"&&user.ruolo==="admin") body=h(Impostazioni,{user:user});
  else if(view==="guida") body=h(Guida,{user:user});
  else body=h(Dashboard,{openScheda:openScheda,openVal:openVal});
  return h(Fragment,null,h(Header,{user:user,view:view==="scheda"?(user&&user.ruolo==="utente"?"home":"schede"):view==="valform"?"val":view,go:go,onLogout:logout}),
    DB.error&&user&&DB.mode!=="local"?h("div",{style:{maxWidth:1180,margin:"12px auto 0",padding:"0 20px"}},h(Alert,{k:"err"},"Problema di sincronizzazione: "+DB.error)):null,
    h("main",null,body),h(Footer,null),tst?h("div",{className:"toast "+tst.t,role:"status"},tst.m):null);
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));

</script>
</body>
</html>
